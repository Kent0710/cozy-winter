        function renderCookOptions() {
          cookContent.replaceChildren();

          cookRecipes.forEach((recipe) => {
            const option = document.createElement('button');
            option.type = 'button';
            option.className = 'eat-item';
            option.textContent = recipe.name;
            option.disabled =
              cooking || (recipe.requiresFish && fishCount === 0);
            option.addEventListener('click', () => startCooking(recipe));
            cookContent.appendChild(option);
          });
        }

        function startCooking(recipe) {
          if (cooking || (recipe.requiresFish && fishCount === 0)) return;
          cooking = true;
          cookClose.disabled = true;
          cookStatus.textContent = 'Cooking...';
          renderCookOptions();

          cookingTimer = window.setTimeout(() => {
            if (recipe.requiresFish) fishCount -= 1;
            foodInventory.push(recipe.name);
            cooking = false;
            cookClose.disabled = false;
            cookStatus.textContent = 'Added to pouch ✓';
            renderCookOptions();

            cookingCloseTimer = window.setTimeout(() => closeCookPanel(), 1200);
          }, 2000);
        }

        function openCookPanel() {
          if (
            sleeping ||
            fishingState ||
            stargazingState ||
            cooking ||
            brewingTea ||
            readingState
          ) return;
          closeEatPanel();
          releasePointerLock();
          cookTitle.textContent = isInsideCabin
            ? 'Stove cooking'
            : 'Campfire cooking';
          cookStatus.textContent = '';
          renderCookOptions();
          cookPopup.classList.add('is-open');
          cookPopup.setAttribute('aria-hidden', 'false');
          cookClose.focus();
          updatePointerUi();
        }

        function setFishingStatus(message, isVisible) {
          fishingStatus.textContent = message;
          fishingStatus.classList.toggle('is-visible', isVisible);
          fishingStatus.setAttribute('aria-hidden', isVisible ? 'false' : 'true');
        }

        function smoothStep(value) {
          return value * value * (3 - 2 * value);
        }

        function updateSkySunPosition(elevation, azimuth) {
          const phi = THREE.MathUtils.degToRad(90 - elevation);
          const theta = THREE.MathUtils.degToRad(azimuth);
          skySunPosition.setFromSphericalCoords(1, phi, theta);
          skyUniforms.sunPosition.value.copy(skySunPosition);
        }

        function applyCelestialOpacity() {
          for (let i = 0; i < auroraMaterials.length; i += 1) {
            const material = auroraMaterials[i];
            const baseOpacity = material.userData.baseOpacity;
            const stargazeOpacity =
              baseOpacity + (0.35 - baseOpacity) * stargazeVisualAmount;
            material.uniforms.opacity.value =
              stargazeOpacity * celestialVisibility;
          }
          for (let i = 0; i < starMaterials.length; i += 1) {
            const material = starMaterials[i];
            material.opacity =
              material.userData.baseOpacity * celestialVisibility;
          }
          milkyWayMaterial.opacity =
            milkyWayMaterial.userData.baseOpacity * celestialVisibility;
          stars.visible = celestialVisibility > 0.001;
          milkyWay.visible = celestialVisibility > 0.001;
        }

        function updateStarTwinkle(elapsed) {
          for (let i = 0; i < starMaterials.length; i += 1) {
            const material = starMaterials[i];
            const shimmer =
              1 +
              Math.sin(
                elapsed * material.userData.twinkleSpeed +
                  material.userData.twinkleOffset
              ) *
                0.18 *
                stargazeVisualAmount;
            material.opacity = Math.max(
              0,
              Math.min(
                1,
                material.userData.baseOpacity *
                  celestialVisibility *
                  shimmer
              )
            );
          }
        }

        function updateSnowSparkles(elapsed) {
          const moonStrength =
            celestialVisibility *
            Math.min(
              1,
              (moonLight.intensity + moonFarLight.intensity) / 0.3
            );
          const fireStrength = Math.max(
            0,
            Math.min(1, (fireLight.intensity - 5) / 4)
          );
          const illumination = Math.max(moonStrength, fireStrength);
          snowSparkleLayer.visible = illumination > 0.025;

          for (let i = 0; i < snowSparkleMaterials.length; i += 1) {
            const material = snowSparkleMaterials[i];
            const glitter =
              0.5 +
              Math.sin(
                elapsed * material.userData.randomFreq +
                  material.userData.randomOffset
              ) *
                0.5;
            material.opacity = illumination * (0.04 + glitter * 0.66);
          }
        }

        function updateDayNightCycle(now) {
          const cyclePosition = ((now - cycleStartTime) % 600000) / 600000;
          let phaseIndex = 0;
          let phaseStart = 0;

          for (let i = 0; i < cyclePhases.length; i += 1) {
            const phaseEnd = phaseStart + cyclePhases[i].duration;
            if (cyclePosition < phaseEnd || i === cyclePhases.length - 1) {
              phaseIndex = i;
              break;
            }
            phaseStart = phaseEnd;
          }

          const phase = cyclePhases[phaseIndex];
          const nextPhase = cyclePhases[(phaseIndex + 1) % cyclePhases.length];
          const phaseProgress = Math.min(
            1,
            Math.max(0, (cyclePosition - phaseStart) / phase.duration)
          );
          const colorBlend = smoothStep(phaseProgress);

          cycleSkyColor.lerpColors(phase.sky, nextPhase.sky, colorBlend);
          cycleAmbientColor.lerpColors(
            phase.ambient,
            nextPhase.ambient,
            colorBlend
          );
          cycleFogColor.lerpColors(phase.fog, nextPhase.fog, colorBlend);
          const sunElevation =
            phase.sunElevation +
            (nextPhase.sunElevation - phase.sunElevation) * colorBlend;
          const sunAzimuth = cyclePosition * 360 - 90;
          updateSkySunPosition(sunElevation, sunAzimuth);
          renderer.setClearColor(cycleSkyColor, 1);
          ambientLight.color.copy(cycleAmbientColor);
          scene.fog.color.copy(cycleFogColor);
          cycleClock.textContent = phase.name;
          campfireLightMultiplier =
            phase.fire + (nextPhase.fire - phase.fire) * colorBlend;

          if (phase.name === 'Night') {
            const fadeOut = Math.max(0, Math.min(1, (phaseProgress - 0.65) / 0.35));
            celestialVisibility = 1 - smoothStep(fadeOut);
          } else if (phase.name === 'Dusk') {
            celestialVisibility = smoothStep(phaseProgress);
          } else {
            celestialVisibility = 0;
          }

          if (phase.name === 'Dawn') {
            cloudVisibility = smoothStep(Math.min(1, phaseProgress * 3));
          } else if (phase.name === 'Day') {
            cloudVisibility = 1;
          } else if (phase.name === 'Dusk') {
            cloudVisibility =
              1 - smoothStep(Math.min(1, phaseProgress * 2.5));
          } else {
            cloudVisibility = 0;
          }
          cloudMaterial.opacity = 0.6 * cloudVisibility;
          cloudLayer.visible = cloudVisibility > 0.001;

          applyCelestialOpacity();
        }

        function updateCabinInteriorLighting(elapsed, delta) {
          const halfCabinWidth = CABIN_WIDTH * 0.5;
          const halfCabinDepth = CABIN_DEPTH * 0.5;
          isInsideCabin =
            camera.position.x > cabin.position.x - halfCabinWidth &&
            camera.position.x < cabin.position.x + halfCabinWidth &&
            camera.position.z > cabin.position.z - halfCabinDepth &&
            camera.position.z < cabin.position.z + halfCabinDepth;
          ssaoPass.kernelRadius = isInsideCabin ? 0.4 : 0.8;

          cabinInterior.visible = isInsideCabin;
          setAmbientAudioMix(isInsideCabin);

          const targetBlend = isInsideCabin ? 1 : 0;
          const transitionStep = delta / 0.5;
          if (interiorLightingBlend < targetBlend) {
            interiorLightingBlend = Math.min(
              targetBlend,
              interiorLightingBlend + transitionStep
            );
          } else if (interiorLightingBlend > targetBlend) {
            interiorLightingBlend = Math.max(
              targetBlend,
              interiorLightingBlend - transitionStep
            );
          }

          for (let i = 0; i < interiorFlickerLights.length; i += 1) {
            const light = interiorFlickerLights[i];
            light.intensity =
              (light.userData.baseIntensity +
                Math.sin(
                  elapsed * light.userData.flickerSpeed +
                    light.userData.flickerOffset
                ) *
                  0.15) *
              interiorLightingBlend;
          }
          stoveGlow.intensity =
            (0.3 + Math.sin(elapsed * (Math.PI * 2 / 3)) * 0.1) *
            interiorLightingBlend;
          windowMaterial.emissiveIntensity =
            interiorLightingBlend * (0.08 + celestialVisibility * 1.55);
          ambientLight.intensity = 0.4 * (1 - interiorLightingBlend * 0.25);
          snowBounceLight.intensity =
            0.6 * (1 - interiorLightingBlend * 0.7);
          for (let i = 0; i < interiorWallBounceLights.length; i += 1) {
            interiorWallBounceLights[i].intensity =
              interiorWallBounceLights[i].userData.baseIntensity *
              interiorLightingBlend;
          }
          cabinGlow.intensity = 1.7 * (1 - interiorLightingBlend * 0.65);
          campfireInteriorMultiplier = 1 - interiorLightingBlend * 0.65;

          oilLamp.rotation.z =
            Math.sin(elapsed * 0.8) * THREE.MathUtils.degToRad(2);
          oilLamp.rotation.x =
            Math.cos(elapsed * 0.8) * THREE.MathUtils.degToRad(0.65);
        }

        let shadowModeIsInside = null;
        let shadowUpdateFrame = 0;

        function setDynamicCasterEnabled(caster, enabled) {
          if (caster.enabled === enabled) return false;
          caster.enabled = enabled;
          for (let i = 0; i < caster.meshes.length; i += 1) {
            caster.meshes[i].castShadow = enabled;
          }
          return true;
        }

        function updateDynamicShadowSystem() {
          let shadowStateChanged = false;
          shadowUpdateFrame += 1;

          if (shadowModeIsInside !== isInsideCabin) {
            shadowModeIsInside = isInsideCabin;
            moonLight.castShadow = !isInsideCabin;
            moonFarLight.castShadow = !isInsideCabin;
            fireLight.castShadow = !isInsideCabin;
            interiorPointLight.castShadow = isInsideCabin;
            shadowStateChanged = true;
          }

          for (let i = 0; i < dynamicOutdoorShadowCasters.length; i += 1) {
            const caster = dynamicOutdoorShadowCasters[i];
            const distanceToPlayer = Math.hypot(
              camera.position.x - caster.x,
              camera.position.z - caster.z
            );
            const shouldCast =
              !isInsideCabin && distanceToPlayer <= caster.maximumDistance;
            shadowStateChanged =
              setDynamicCasterEnabled(caster, shouldCast) ||
              shadowStateChanged;
          }

          const cadenceRequestsUpdate = isInsideCabin
            ? shadowUpdateFrame % 2 === 0
            : shadowUpdateFrame % 4 === 0;
          if (shadowStateChanged || cadenceRequestsUpdate) {
            renderer.shadowMap.needsUpdate = true;
          }
        }

        const lightProbeEntries = [];
        const lightProbeByName = {};
        let lightProbesInitialized = false;

        function initializeLightProbeGI() {
          if (
            lightProbesInitialized ||
            !THREE.LightProbeGenerator ||
            !THREE.LightProbe
          ) {
            return;
          }

          const captureDescriptors = [
            {
              name: 'center',
              position: new THREE.Vector3(
                0,
                getTerrainHeightAt(0, 0) + 2.2,
                0
              ),
              capturesInterior: false
            },
            {
              name: 'cabin',
              position: new THREE.Vector3(
                cabin.position.x,
                cabin.position.y + 1.6,
                cabin.position.z
              ),
              capturesInterior: true
            },
            {
              name: 'campfire',
              position: new THREE.Vector3(
                campfire.position.x,
                getTerrainHeightAt(
                  campfire.position.x,
                  campfire.position.z
                ) + 1.8,
                campfire.position.z
              ),
              capturesInterior: false
            },
            {
              name: 'lake',
              position: new THREE.Vector3(
                lake.position.x,
                getTerrainHeightAt(lake.position.x, lake.position.z) + 2,
                lake.position.z
              ),
              capturesInterior: false
            }
          ];

          const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(32, {
            format: THREE.RGBAFormat,
            type: THREE.UnsignedByteType,
            minFilter: THREE.LinearFilter,
            magFilter: THREE.LinearFilter,
            generateMipmaps: false,
            depthBuffer: true
          });
          cubeRenderTarget.texture.encoding = THREE.sRGBEncoding;
          const probeCamera = new THREE.CubeCamera(
            0.1,
            140,
            cubeRenderTarget
          );
          const previousInteriorVisibility = cabinInterior.visible;
          const previousInteriorLightIntensity = interiorPointLight.intensity;
          const previousWallBounceIntensities = interiorWallBounceLights.map(
            (light) => light.intensity
          );
          const previousShadowState = renderer.shadowMap.enabled;
          renderer.shadowMap.enabled = false;

          for (let i = 0; i < captureDescriptors.length; i += 1) {
            const descriptor = captureDescriptors[i];
            cabinInterior.visible = descriptor.capturesInterior;
            interiorPointLight.intensity = descriptor.capturesInterior ? 6 : 0;
            for (
              let lightIndex = 0;
              lightIndex < interiorWallBounceLights.length;
              lightIndex += 1
            ) {
              interiorWallBounceLights[lightIndex].intensity =
                descriptor.capturesInterior ? 0.4 : 0;
            }

            probeCamera.position.copy(descriptor.position);
            probeCamera.update(renderer, scene);
            const probe = THREE.LightProbeGenerator.fromCubeRenderTarget(
              renderer,
              cubeRenderTarget
            );
            probe.position.copy(descriptor.position);
            probe.intensity = 0;
            probe.name = `${descriptor.name.toUpperCase()}_IRRADIANCE_PROBE`;
            probe.userData.isIrradianceProbe = true;
            probe.userData.captureLocation = descriptor.name;
            lightProbeEntries.push({
              name: descriptor.name,
              probe,
              position: descriptor.position.clone()
            });
            lightProbeByName[descriptor.name] = probe;
          }

          cabinInterior.visible = previousInteriorVisibility;
          interiorPointLight.intensity = previousInteriorLightIntensity;
          for (
            let i = 0;
            i < interiorWallBounceLights.length;
            i += 1
          ) {
            interiorWallBounceLights[i].intensity =
              previousWallBounceIntensities[i];
          }
          renderer.shadowMap.enabled = previousShadowState;
          cubeRenderTarget.dispose();

          for (let i = 0; i < lightProbeEntries.length; i += 1) {
            scene.add(lightProbeEntries[i].probe);
          }
          lightProbesInitialized = true;
        }

        function lightProbeFalloff(distance, radius) {
          const normalizedDistance = Math.max(
            0,
            Math.min(1, distance / radius)
          );
          const remaining = 1 - normalizedDistance;
          return remaining * remaining * (3 - 2 * remaining);
        }

        function updateLightProbeIrradiance() {
          if (!lightProbesInitialized) return;

          if (isInsideCabin) {
            lightProbeByName.center.intensity = 0;
            lightProbeByName.campfire.intensity = 0;
            lightProbeByName.lake.intensity = 0;
            lightProbeByName.cabin.intensity = 0.38 * interiorLightingBlend;
            return;
          }

          const fireDistance = Math.hypot(
            camera.position.x - campfire.position.x,
            camera.position.z - campfire.position.z
          );
          const lakeDistance = Math.hypot(
            camera.position.x - lake.position.x,
            camera.position.z - lake.position.z
          );
          const centerDistance = Math.hypot(
            camera.position.x,
            camera.position.z
          );
          const daylightFactor = 1 + cloudVisibility * 0.28;

          lightProbeByName.cabin.intensity = 0;
          lightProbeByName.center.intensity =
            0.08 +
            lightProbeFalloff(centerDistance, 48) * 0.08 * daylightFactor;
          lightProbeByName.campfire.intensity =
            lightProbeFalloff(fireDistance, 18) *
            0.28 *
            campfireLightMultiplier;
          lightProbeByName.lake.intensity =
            lightProbeFalloff(lakeDistance, 24) * 0.18 * daylightFactor;
        }

        const moonWorldPositionForShafts = new THREE.Vector3();
        const fireWorldPositionForShafts = new THREE.Vector3();
        const projectedLightPosition = new THREE.Vector3();
        const cameraForwardForShafts = new THREE.Vector3();
        const directionToLight = new THREE.Vector3();
        const directionToMountain = new THREE.Vector3();
        const mountainCenterForShafts = new THREE.Vector3();

        function mountainBlocksMoon(moonDirection, moonDistance) {
          for (let i = 0; i < mountainFootprints.length; i += 1) {
            const mountain = mountainFootprints[i];
            mountainCenterForShafts.set(
              mountain.x,
              mountain.y + mountain.height * 0.52,
              mountain.z
            );
            directionToMountain
              .copy(mountainCenterForShafts)
              .sub(camera.position);
            const mountainDistance = directionToMountain.length();
            if (mountainDistance >= moonDistance || mountainDistance < 0.001) {
              continue;
            }

            directionToMountain.multiplyScalar(1 / mountainDistance);
            const alignment = directionToMountain.dot(moonDirection);
            const angularRadius = Math.atan2(
              mountain.radius * 0.82,
              mountainDistance
            );
            if (alignment > Math.cos(angularRadius)) return true;
          }
          return false;
        }

        function projectLightToScreen(worldPosition, targetUniform) {
          projectedLightPosition.copy(worldPosition).project(camera);
          targetUniform.set(
            projectedLightPosition.x * 0.5 + 0.5,
            projectedLightPosition.y * 0.5 + 0.5
          );
          return (
            projectedLightPosition.z > -1 &&
            projectedLightPosition.z < 1 &&
            projectedLightPosition.x > -1.35 &&
            projectedLightPosition.x < 1.35 &&
            projectedLightPosition.y > -1.35 &&
            projectedLightPosition.y < 1.35
          );
        }

        function updateVolumetricLightShafts(fireFlickerFactor) {
          camera.updateWorldMatrix(true, false);
          camera.getWorldDirection(cameraForwardForShafts);

          moonLight.getWorldPosition(moonWorldPositionForShafts);
          directionToLight
            .copy(moonWorldPositionForShafts)
            .sub(camera.position);
          const moonDistance = directionToLight.length();
          if (moonDistance > 0.001) directionToLight.multiplyScalar(1 / moonDistance);
          const moonFacesCamera =
            cameraForwardForShafts.dot(directionToLight) > 0.015;
          const moonOnScreen = projectLightToScreen(
            moonWorldPositionForShafts,
            volumetricLightPass.scatterUniforms.moonScreenPosition.value
          );
          const moonOccluded = mountainBlocksMoon(
            directionToLight,
            moonDistance
          );
          volumetricLightPass.scatterUniforms.moonIntensity.value =
            !isInsideCabin &&
            moonFacesCamera &&
            moonOnScreen &&
            !moonOccluded
              ? celestialVisibility
              : 0;

          fireLight.getWorldPosition(fireWorldPositionForShafts);
          directionToLight
            .copy(fireWorldPositionForShafts)
            .sub(camera.position);
          const fireDistance = directionToLight.length();
          if (fireDistance > 0.001) directionToLight.multiplyScalar(1 / fireDistance);
          const fireFacesCamera =
            cameraForwardForShafts.dot(directionToLight) > -0.08;
          const fireOnScreen = projectLightToScreen(
            fireWorldPositionForShafts,
            volumetricLightPass.scatterUniforms.fireScreenPosition.value
          );
          const fireDistanceFade = Math.max(
            0,
            Math.min(1, 1 - (fireDistance - 5) / 30)
          );
          volumetricLightPass.scatterUniforms.fireIntensity.value =
            !isInsideCabin && fireFacesCamera && fireOnScreen
              ? fireFlickerFactor *
                fireDistanceFade *
                campfireLightMultiplier *
                campfireInteriorMultiplier
              : 0;
        }

        function updateInteriorWindowLightShafts(elapsed) {
          const outsideLightStrength = Math.max(
            cloudVisibility,
            celestialVisibility * 0.9
          );
          const shaftStrength =
            interiorLightingBlend * outsideLightStrength;
          windowShaftMaterial.uniforms.shaftOpacity.value =
            shaftStrength * 0.16;
          windowDustMoteMaterial.opacity = shaftStrength * 0.58;
          windowDustGroup.visible = isInsideCabin && shaftStrength > 0.015;

          if (!windowDustGroup.visible) return;
          for (let i = 0; i < windowDustMotes.length; i += 1) {
            const mote = windowDustMotes[i];
            const phase =
              elapsed * mote.userData.speed + mote.userData.phase;
            mote.position.x =
              mote.userData.baseX + Math.sin(phase * 0.73) * 0.08;
            mote.position.y =
              mote.userData.baseY + Math.sin(phase) * 0.13;
            mote.position.z =
              mote.userData.baseZ + Math.cos(phase * 0.57) * 0.07;
          }
        }

        const woodMaterialResponses = [];
        const woodMaterialResponseMap = new Map();
        const woodColorPalette = new Set([
          0x1a1008,
          0x1d1008,
          0x2a1a0a,
          0x2b170f,
          0x321b10,
          0x321f11,
          0x352017,
          0x3a1a0a,
          0x3a2010,
          0x3a2419,
          0x40261a,
          0x4a2010,
          0x4a2e1a,
          0x5a3520,
          0x8d6841,
          0xb58a58,
          0xc8a87a
        ]);
        const moonlitExteriorWoodColor = new THREE.Color(0x1a1008);
        const firelitWoodHighlightColor = new THREE.Color(0x8a5020);
        const interiorGoldenWoodColor = new THREE.Color(0x6a4020);
        const dynamicWoodColor = new THREE.Color();
        const treeShadowGrid = new Map();
        const TREE_SHADOW_GRID_SIZE = 10;
        let materialLightingFrame = 0;
        let woodMaterialsPrepared = false;

        function objectIsInsideCabinInterior(object) {
          let current = object;
          while (current) {
            if (current === cabinInterior) return true;
            current = current.parent;
          }
          return false;
        }

        function prepareWoodMaterialResponses() {
          if (woodMaterialsPrepared) return;

          scene.traverse((object) => {
            if (!object.isMesh) return;
            const materials = Array.isArray(object.material)
              ? object.material
              : [object.material];
            for (let i = 0; i < materials.length; i += 1) {
              const material = materials[i];
              if (
                !material ||
                !material.isMeshStandardMaterial ||
                material === pineBarkMaterial ||
                !woodColorPalette.has(material.color.getHex())
              ) {
                continue;
              }

              let response = woodMaterialResponseMap.get(material);
              if (!response) {
                response = {
                  material,
                  baseColor: material.color.clone(),
                  interior: false,
                  exteriorCabin:
                    material === cabinOutsideMaterial ||
                    material === cabinFrameMaterial
                };
                woodMaterialResponseMap.set(material, response);
                woodMaterialResponses.push(response);
              }
              response.interior =
                response.interior ||
                objectIsInsideCabinInterior(object) ||
                material === cabinInsideMaterial ||
                material === cabinFloorMaterial;
              material.roughness = 0.75;
              material.metalness = 0;
              material.userData.respondsToAllDynamicLights = true;
            }
          });

          cabinOutsideMaterial.color.copy(moonlitExteriorWoodColor);
          for (let i = 0; i < treeInstanceData.length; i += 1) {
            const treeData = treeInstanceData[i];
            const cellX = Math.floor(treeData.x / TREE_SHADOW_GRID_SIZE);
            const cellZ = Math.floor(treeData.z / TREE_SHADOW_GRID_SIZE);
            const key = `${cellX},${cellZ}`;
            if (!treeShadowGrid.has(key)) treeShadowGrid.set(key, []);
            treeShadowGrid.get(key).push(treeData);
          }
          woodMaterialsPrepared = true;
        }

        function getTreeShadowAmount(
          worldX,
          worldZ,
          shadowDirectionX,
          shadowDirectionZ
        ) {
          const cellX = Math.floor(worldX / TREE_SHADOW_GRID_SIZE);
          const cellZ = Math.floor(worldZ / TREE_SHADOW_GRID_SIZE);
          let shadowAmount = 0;

          for (let offsetX = -2; offsetX <= 2; offsetX += 1) {
            for (let offsetZ = -2; offsetZ <= 2; offsetZ += 1) {
              const trees = treeShadowGrid.get(
                `${cellX + offsetX},${cellZ + offsetZ}`
              );
              if (!trees) continue;
              for (let i = 0; i < trees.length; i += 1) {
                const tree = trees[i];
                const relativeX = worldX - tree.x;
                const relativeZ = worldZ - tree.z;
                const alongShadow =
                  relativeX * shadowDirectionX +
                  relativeZ * shadowDirectionZ;
                const shadowLength = 5 + tree.scale * 6.5;
                if (alongShadow < -0.4 || alongShadow > shadowLength) {
                  continue;
                }
                const acrossShadow = Math.abs(
                  relativeX * -shadowDirectionZ +
                    relativeZ * shadowDirectionX
                );
                const shadowWidth =
                  0.75 + tree.scale * 1.35 *
                  (1 - Math.max(0, alongShadow) / shadowLength * 0.42);
                if (acrossShadow < shadowWidth) {
                  const edgeSoftness = 1 - acrossShadow / shadowWidth;
                  const lengthFade =
                    1 - Math.max(0, alongShadow) / shadowLength;
                  shadowAmount = Math.max(
                    shadowAmount,
                    edgeSoftness * (0.45 + lengthFade * 0.55)
                  );
                }
              }
            }
          }
          return shadowAmount;
        }

        const snowMoonColor = new THREE.Color(0xddeeff);
        const snowShadowColor = new THREE.Color(0x8899aa);
        const snowFireColor = new THREE.Color(0xffad66);
        const snowDynamicColor = new THREE.Color();
        const snowMoonDirection = new THREE.Vector3();
        const snowFirePosition = new THREE.Vector3();
        const foliageMoonColor = new THREE.Color(0x0d2010);
        const foliageFireRimColor = new THREE.Color(0x1a1008);
        const branchSnowMoonColor = new THREE.Color(0xe8f4ff);
        const branchSnowFireColor = new THREE.Color(0xffc092);

        function updateSnowVertexLighting(elapsed, fireFlickerFactor) {
          const positions = terrainGeometry.attributes.position;
          const normals = terrainGeometry.attributes.normal;
          const colors = terrainGeometry.attributes.color;
          snowMoonDirection.copy(moonCascadeOffset).normalize();
          fireLight.getWorldPosition(snowFirePosition);
          const horizontalMoonLength = Math.max(
            0.0001,
            Math.hypot(snowMoonDirection.x, snowMoonDirection.z)
          );
          const shadowDirectionX =
            -snowMoonDirection.x / horizontalMoonLength;
          const shadowDirectionZ =
            -snowMoonDirection.z / horizontalMoonLength;

          for (let i = 0; i < positions.count; i += 1) {
            const x = positions.getX(i);
            const y = positions.getY(i) + TERRAIN_BASE_Y;
            const z = positions.getZ(i);
            const baseOffset = i * 3;
            const baseBrightness = Math.max(
              0.82,
              Math.min(
                1.08,
                (terrainBaseVertexColors[baseOffset] +
                  terrainBaseVertexColors[baseOffset + 1] +
                  terrainBaseVertexColors[baseOffset + 2]) /
                  2.72
              )
            );
            const moonFacing = Math.max(
              0,
              normals.getX(i) * snowMoonDirection.x +
                normals.getY(i) * snowMoonDirection.y +
                normals.getZ(i) * snowMoonDirection.z
            );
            snowDynamicColor.copy(snowMoonColor).multiplyScalar(
              baseBrightness * (0.84 + moonFacing * 0.16)
            );

            const treeShadow =
              Math.abs(x) <= 78 && Math.abs(z) <= 78
                ? getTreeShadowAmount(
                    x,
                    z,
                    shadowDirectionX,
                    shadowDirectionZ
                  )
                : 0;
            snowDynamicColor.lerp(
              snowShadowColor,
              treeShadow * (0.46 + celestialVisibility * 0.22)
            );

            const fireX = snowFirePosition.x - x;
            const fireY = snowFirePosition.y - y;
            const fireZ = snowFirePosition.z - z;
            const fireDistance = Math.max(
              0.001,
              Math.hypot(fireX, fireY, fireZ)
            );
            const fireFacing = Math.max(
              0,
              (normals.getX(i) * fireX +
                normals.getY(i) * fireY +
                normals.getZ(i) * fireZ) /
                fireDistance
            );
            const fireFalloff = Math.max(0, 1 - fireDistance / 18);
            const fireTintAmount =
              fireFacing *
              fireFalloff *
              fireFalloff *
              fireFlickerFactor *
              0.52;
            snowDynamicColor.lerp(snowFireColor, fireTintAmount);

            const sparkleNoise =
              Math.sin(
                x * 32.17 +
                  z * 47.73 +
                  elapsed * (0.65 + (i % 7) * 0.035)
              ) *
                0.5 +
              0.5;
            const sparkle =
              Math.pow(sparkleNoise, 18) *
              Math.max(celestialVisibility * 0.14, fireTintAmount * 0.2);
            snowDynamicColor.offsetHSL(0, -sparkle * 0.15, sparkle);
            snowDynamicColor.r = Math.min(1, snowDynamicColor.r);
            snowDynamicColor.g = Math.min(1, snowDynamicColor.g);
            snowDynamicColor.b = Math.min(1, snowDynamicColor.b);
            colors.setXYZ(
              i,
              snowDynamicColor.r,
              snowDynamicColor.g,
              snowDynamicColor.b
            );
          }

          colors.needsUpdate = true;
          terrainMaterial.roughness =
            0.94 + Math.sin(elapsed * 0.37) * 0.018;
          terrainMaterial.emissiveIntensity =
            Math.max(
              0,
              Math.min(
                0.16,
                fireFlickerFactor *
                  campfireLightMultiplier *
                  campfireInteriorMultiplier *
                  0.12
              )
            );
        }

        function updateWoodMaterialLighting(fireFlickerFactor) {
          const fireDeltaX = Math.max(
            Math.abs(campfire.position.x - cabin.position.x) -
              CABIN_WIDTH * 0.5,
            0
          );
          const fireDeltaZ = Math.max(
            Math.abs(campfire.position.z - cabin.position.z) -
              CABIN_DEPTH * 0.5,
            0
          );
          const cabinFireDistance = Math.hypot(fireDeltaX, fireDeltaZ);
          const exteriorFireInfluence =
            Math.pow(Math.max(0, 1 - cabinFireDistance / 18), 2) *
            fireFlickerFactor *
            campfireLightMultiplier;

          for (let i = 0; i < woodMaterialResponses.length; i += 1) {
            const response = woodMaterialResponses[i];
            const material = response.material;
            material.roughness = 0.75;
            material.metalness = 0;

            if (response.interior) {
              dynamicWoodColor.copy(response.baseColor).lerp(
                interiorGoldenWoodColor,
                interiorLightingBlend * 0.3
              );
              material.color.copy(dynamicWoodColor);
              material.emissive.copy(interiorGoldenWoodColor);
              material.emissiveIntensity = interiorLightingBlend * 0.018;
            } else if (response.exteriorCabin) {
              dynamicWoodColor.copy(moonlitExteriorWoodColor).lerp(
                firelitWoodHighlightColor,
                Math.min(0.34, exteriorFireInfluence * 0.34)
              );
              material.color.copy(dynamicWoodColor);
              material.emissive.copy(firelitWoodHighlightColor);
              material.emissiveIntensity =
                Math.min(0.04, exteriorFireInfluence * 0.04);
            }
          }
        }

        function updateTreeMaterialLighting(fireFlickerFactor) {
          let maximumWarmResponse = 0;
          for (let i = 0; i < treeLightingEntries.length; i += 1) {
            const entry = treeLightingEntries[i];
            const fireDistance = Math.hypot(
              entry.x - campfire.position.x,
              entry.z - campfire.position.z
            );
            const fireProximity = Math.pow(
              Math.max(0, 1 - fireDistance / 20),
              2
            );
            const warmResponse = Math.min(
              1,
              fireProximity *
                fireFlickerFactor *
                campfireLightMultiplier *
                campfireInteriorMultiplier
            );
            maximumWarmResponse = Math.max(
              maximumWarmResponse,
              warmResponse
            );
            entry.foliageColor.lerpColors(
              foliageMoonColor,
              foliageFireRimColor,
              warmResponse * 0.26
            );
            entry.snowColor.lerpColors(
              branchSnowMoonColor,
              branchSnowFireColor,
              warmResponse * 0.32
            );
          }
          instancedFoliageMaterial.emissive.setHex(0x1a1008);
          instancedFoliageMaterial.emissiveIntensity =
            maximumWarmResponse * 0.05;
          instancedSnowMaterial.emissive.setHex(0xff6a1a);
          instancedSnowMaterial.emissiveIntensity =
            maximumWarmResponse * 0.14;
        }

        const snowScatteringStates = [];
        const snowBacklightDirectionView = new THREE.Vector3();

        function enableSnowSubsurfaceScattering(material) {
          if (material.userData.snowSubsurfaceScattering) return;
          const state = {
            direction: { value: new THREE.Vector3(0, 1, 0) },
            strength: { value: 1 }
          };
          material.userData.snowSubsurfaceScattering = state;
          material.onBeforeCompile = (shader) => {
            shader.uniforms.snowBacklightDirectionView = state.direction;
            shader.uniforms.snowBacklightStrength = state.strength;
            shader.fragmentShader = shader.fragmentShader.replace(
              '#include <common>',
              `#include <common>
              uniform vec3 snowBacklightDirectionView;
              uniform float snowBacklightStrength;`
            );
            shader.fragmentShader = shader.fragmentShader.replace(
              '#include <lights_fragment_begin>',
              `float snowBacklitFactor = pow(
                max(
                  0.0,
                  -dot(normal, normalize(snowBacklightDirectionView))
                ),
                1.35
              );
              totalEmissiveRadiance +=
                vec3(0.784314, 0.878431, 1.0) *
                0.06 *
                snowBacklitFactor *
                snowBacklightStrength;
              #include <lights_fragment_begin>`
            );
          };
          material.customProgramCacheKey = () =>
            `cinematic-snow-subsurface-${material.id}`;
          material.needsUpdate = true;
          snowScatteringStates.push(state);
        }

        function initializeSnowSubsurfaceScattering() {
          [
            terrainMaterial,
            snowCapMaterial,
            roofSnowMaterial,
            instancedSnowMaterial,
            rockSnowMaterial
          ].forEach(enableSnowSubsurfaceScattering);
        }

        function updateSnowSubsurfaceScattering() {
          snowBacklightDirectionView
            .copy(moonCascadeOffset)
            .normalize()
            .transformDirection(camera.matrixWorldInverse);
          const scatteringStrength =
            celestialVisibility *
            Math.min(
              1,
              (moonLight.intensity + moonFarLight.intensity) / 0.3
            );
          for (let i = 0; i < snowScatteringStates.length; i += 1) {
            snowScatteringStates[i].direction.value.copy(
              snowBacklightDirectionView
            );
            snowScatteringStates[i].strength.value = scatteringStrength;
          }
        }

        function updateDynamicMaterialResponses(elapsed, fireFlickerFactor) {
          if (!woodMaterialsPrepared) prepareWoodMaterialResponses();
          updateSnowVertexLighting(elapsed, fireFlickerFactor);
          updateWoodMaterialLighting(fireFlickerFactor);
          updateTreeMaterialLighting(fireFlickerFactor);
        }

        function worldToMinimapX(worldX) {
          const minimapScale = 44 / WORLD_BOUNDARY_RADIUS;
          return (
            50 +
            Math.max(
              -WORLD_BOUNDARY_RADIUS,
              Math.min(WORLD_BOUNDARY_RADIUS, worldX)
            ) * minimapScale
          );
        }

        function worldToMinimapY(worldZ) {
          const minimapScale = 44 / WORLD_BOUNDARY_RADIUS;
          return (
            50 +
            Math.max(
              -WORLD_BOUNDARY_RADIUS,
              Math.min(WORLD_BOUNDARY_RADIUS, worldZ)
            ) * minimapScale
          );
        }

        function drawMinimapDot(worldPosition, color, radius) {
          minimapContext.beginPath();
          minimapContext.arc(
            worldToMinimapX(worldPosition.x),
            worldToMinimapY(worldPosition.z),
            radius,
            0,
            Math.PI * 2
          );
          minimapContext.fillStyle = color;
          minimapContext.fill();
        }

        function drawMinimap() {
          minimapContext.clearRect(0, 0, 100, 100);
          minimapContext.fillStyle = 'rgba(5, 10, 22, 0.78)';
          minimapContext.fillRect(0, 0, 100, 100);

          minimapContext.strokeStyle = 'rgba(245, 230, 200, 0.16)';
          minimapContext.lineWidth = 1;
          minimapContext.beginPath();
          minimapContext.arc(50, 50, 44, 0, Math.PI * 2);
          minimapContext.stroke();

          lake.getWorldPosition(minimapWorldPosition);
          minimapContext.beginPath();
          minimapContext.arc(
            worldToMinimapX(minimapWorldPosition.x),
            worldToMinimapY(minimapWorldPosition.z),
            11.5 * (44 / WORLD_BOUNDARY_RADIUS),
            0,
            Math.PI * 2
          );
          minimapContext.fillStyle = 'rgba(98, 203, 235, 0.5)';
          minimapContext.fill();
          minimapContext.strokeStyle = 'rgba(210, 245, 255, 0.75)';
          minimapContext.stroke();

          cabin.getWorldPosition(minimapWorldPosition);
          const cabinMapScale = 44 / WORLD_BOUNDARY_RADIUS;
          minimapContext.fillStyle = '#70452f';
          minimapContext.fillRect(
            worldToMinimapX(minimapWorldPosition.x) - 9 * cabinMapScale,
            worldToMinimapY(minimapWorldPosition.z) - 7 * cabinMapScale,
            18 * cabinMapScale,
            14 * cabinMapScale
          );

          campfire.getWorldPosition(minimapWorldPosition);
          drawMinimapDot(minimapWorldPosition, '#ff7a1a', 3.2);

          for (let i = 0; i < interactionZones.length; i += 1) {
            const zone = interactionZones[i];
            if (!zone.visible) continue;
            zone.getWorldPosition(minimapWorldPosition);
            drawMinimapDot(
              minimapWorldPosition,
              zone.userData.mapColor,
              zone === activeInteractionZone ? 3 : 2.1
            );
          }

          camera.getWorldDirection(minimapFacingDirection);
          if (
            Math.abs(minimapFacingDirection.x) +
              Math.abs(minimapFacingDirection.z) >
            0.001
          ) {
            minimapFacingAngle = Math.atan2(
              minimapFacingDirection.z,
              minimapFacingDirection.x
            );
          }

          const playerX = worldToMinimapX(camera.position.x);
          const playerY = worldToMinimapY(camera.position.z);
          minimapContext.save();
          minimapContext.translate(playerX, playerY);
          minimapContext.rotate(minimapFacingAngle);
          minimapContext.beginPath();
          minimapContext.moveTo(7, 0);
          minimapContext.lineTo(-2.5, -3.5);
          minimapContext.lineTo(-2.5, 3.5);
          minimapContext.closePath();
          minimapContext.fillStyle = '#ffffff';
          minimapContext.fill();
          minimapContext.beginPath();
          minimapContext.arc(0, 0, 3.2, 0, Math.PI * 2);
          minimapContext.fill();
          minimapContext.restore();
        }

        function startFishing() {
          if (
            sleeping ||
            cooking ||
            fishingState ||
            stargazingState ||
            brewingTea ||
            readingState
          ) return;
          closeEatPanel();
          closeCookPanel();
          headBobBlend = 0;
          playerIsMoving = false;
          camera.position.y = playerHeight;
          window.clearTimeout(fishingStatusHideTimer);
          fishingState = {
            startedAt: clock.elapsedTime,
            waitDuration: 5 + Math.random() * 3
          };
          fishingLine.visible = true;
          sceneShell.classList.add('is-fishing');
          setFishingStatus('Waiting...', true);
          updatePointerUi();
        }

        function cancelFishing() {
          if (!fishingState) return;
          fishingState = null;
          fishingLine.visible = false;
          sceneShell.classList.remove('is-fishing');
          setFishingStatus('', false);
          updatePointerUi();
        }

        function updateFishing(elapsed) {
          if (!fishingState) return;
          const waitingTime = elapsed - fishingState.startedAt;
          const dotCount = 1 + Math.floor(waitingTime / 0.7) % 3;
          fishingStatus.textContent = `Waiting${'.'.repeat(dotCount)}`;

          if (waitingTime >= fishingState.waitDuration) {
            const caughtFish = Math.random() < 0.7;
            if (caughtFish) fishCount += 1;
            fishingState = null;
            fishingLine.visible = false;
            sceneShell.classList.remove('is-fishing');
            setFishingStatus(
              caughtFish
                ? 'You caught a fish! 🐟'
                : 'Nothing this time... the ice is quiet.',
              true
            );
            updatePointerUi();
            fishingStatusHideTimer = window.setTimeout(
              () => setFishingStatus('', false),
              1500
            );
          }
        }

        function setStargazeVisualAmount(amount) {
          stargazeVisualAmount = amount;
          applyCelestialOpacity();
        }

        function setStargazeMessage(isVisible) {
          stargazeMessage.classList.toggle('is-visible', isVisible);
          stargazeMessage.setAttribute('aria-hidden', isVisible ? 'false' : 'true');
        }

        function startStargazing() {
          if (
            sleeping ||
            cooking ||
            fishingState ||
            stargazingState ||
            brewingTea ||
            readingState
          ) return;
          closeEatPanel();
          closeCookPanel();
          headBobBlend = 0;
          playerIsMoving = false;
          const homeQuaternion = camera.quaternion.clone();
          const homeEuler = new THREE.Euler().setFromQuaternion(
            homeQuaternion,
            'YXZ'
          );
          const skyQuaternion = new THREE.Quaternion().setFromEuler(
            new THREE.Euler(Math.PI / 2, homeEuler.y, 0, 'YXZ')
          );
          stargazingState = {
            phase: 'approach',
            phaseStart: clock.elapsedTime,
            startedAt: clock.elapsedTime,
            homeQuaternion,
            skyQuaternion,
            returnStartQuaternion: new THREE.Quaternion(),
            returnStartAmount: 1
          };
          camera.position.y = playerHeight;
          setStargazeVisualAmount(0);
          setStargazeMessage(true);
          updatePointerUi();
        }

        function beginStargazeReturn() {
          if (!stargazingState || stargazingState.phase === 'return') return;
          stargazingState.phase = 'return';
          stargazingState.phaseStart = clock.elapsedTime;
          stargazingState.returnStartQuaternion.copy(camera.quaternion);
          stargazingState.returnStartAmount = stargazeVisualAmount;
        }

        function updateStargazingCamera(elapsed) {
          if (!stargazingState) return;
          const state = stargazingState;
          camera.position.y = playerHeight;

          if (state.phase === 'approach') {
            const progress = Math.min(1, (elapsed - state.phaseStart) / 2);
            const easedProgress = smoothStep(progress);
            camera.quaternion.slerpQuaternions(
              state.homeQuaternion,
              state.skyQuaternion,
              easedProgress
            );
            setStargazeVisualAmount(easedProgress);

            if (progress >= 1) state.phase = 'watching';
          } else if (state.phase === 'watching') {
            camera.quaternion.copy(state.skyQuaternion);
            setStargazeVisualAmount(1);
          } else {
            const progress = Math.min(1, (elapsed - state.phaseStart) / 2);
            const easedProgress = smoothStep(progress);
            camera.quaternion.slerpQuaternions(
              state.returnStartQuaternion,
              state.homeQuaternion,
              easedProgress
            );
            setStargazeVisualAmount(
              state.returnStartAmount * (1 - easedProgress)
            );

            if (progress >= 1) {
              camera.position.y = playerHeight;
              camera.quaternion.copy(state.homeQuaternion);
              setStargazeVisualAmount(0);
              setStargazeMessage(false);
              stargazingState = null;
              setStatus('rest', playerStatus.rest + 10);
              updatePointerUi();
            }
            return;
          }

          if (elapsed - state.startedAt >= 8) beginStargazeReturn();
        }

        function showEnergyFloat() {
          const eatZone = interactionZones.find(
            (zone) => zone.userData.zone === 'EAT' && zone.visible
          );
          if (!eatZone) return;

          eatZone.getWorldPosition(energyWorldPosition);
          energySprite.position.copy(energyWorldPosition);
          energySprite.position.y += 1.3;
          energySprite.material.opacity = 1;
          energySprite.visible = true;
          energyFloatState = {
            age: 0,
            startY: energySprite.position.y
          };
        }

        function updateEnergyFloat(delta) {
          if (!energyFloatState) return;
          energyFloatState.age += delta;
          const progress = Math.min(1, energyFloatState.age / 1.4);
          energySprite.position.y = energyFloatState.startY + progress * 1.6;
          energySprite.material.opacity = 1 - progress;

          if (progress >= 1) {
            energySprite.visible = false;
            energySprite.material.opacity = 0;
            energyFloatState = null;
          }
        }

        function eatFoodItem(index) {
          if (!foodInventory[index]) return;
          foodInventory.splice(index, 1);
          closeEatPanel();
          setStatus('hunger', playerStatus.hunger + 25);
          showEnergyFloat();
        }

        function renderFoodInventory() {
          eatContent.replaceChildren();

          if (foodInventory.length === 0) {
            const emptyMessage = document.createElement('p');
            emptyMessage.textContent = 'Your food pouch is empty. Try cooking first. 🍵';
            eatContent.appendChild(emptyMessage);
            return;
          }

          const prompt = document.createElement('p');
          prompt.textContent = 'Choose something to eat:';
          const itemList = document.createElement('div');
          itemList.className = 'eat-items';

          foodInventory.forEach((item, index) => {
            const itemButton = document.createElement('button');
            itemButton.type = 'button';
            itemButton.className = 'eat-item';
            itemButton.textContent = item;
            itemButton.addEventListener('click', () => eatFoodItem(index));
            itemList.appendChild(itemButton);
          });

          eatContent.append(prompt, itemList);
        }

        function openEatPanel() {
          if (
            sleeping ||
            cooking ||
            fishingState ||
            stargazingState ||
            brewingTea ||
            readingState
          ) return;

        function startSleep() {
          if (
            sleeping ||
            cooking ||
            fishingState ||
            stargazingState ||
            brewingTea ||
            readingState
          ) return;
          sleeping = true;
          sleepState = {
            phase: 'lowering',
            phaseStart: clock.elapsedTime,
            startY: camera.position.y,
            startQuaternion: camera.quaternion.clone()
          };
          headBobBlend = 0;
          playerIsMoving = false;
          closeEatPanel();
          closeCookPanel();
          updatePointerUi();
          sleepOverlay.classList.remove('is-dark', 'is-message-visible');
          sleepOverlay.setAttribute('aria-hidden', 'true');
        }

        function updateSleepSequence(elapsed) {
          if (!sleepState) return;
          const state = sleepState;
          const phaseElapsed = elapsed - state.phaseStart;
          camera.quaternion.copy(state.startQuaternion);

          if (state.phase === 'lowering') {
            const progress = smoothStep(Math.min(1, phaseElapsed / 1));
            camera.position.y = state.startY + (0.4 - state.startY) * progress;
            if (phaseElapsed >= 1) {
              camera.position.y = 0.4;
              state.phase = 'fadeToBlack';
              state.phaseStart = elapsed;
              sleepOverlay.setAttribute('aria-hidden', 'false');
              sleepOverlay.classList.add('is-dark');
            }
            return;
          }

          if (state.phase === 'fadeToBlack') {
            camera.position.y = 0.4;
            if (phaseElapsed >= 1.5) {
              state.phase = 'resting';
              state.phaseStart = elapsed;
              sleepOverlay.classList.add('is-message-visible');
            }
            return;
          }

          if (state.phase === 'resting') {
            camera.position.y = 0.4;
            if (phaseElapsed >= 2) {
              state.phase = 'waking';
              state.phaseStart = elapsed;
              sleepOverlay.classList.remove('is-message-visible', 'is-dark');
              sleepOverlay.setAttribute('aria-hidden', 'true');
            }
            return;
          }

          const riseProgress = smoothStep(Math.min(1, phaseElapsed / 1));
          camera.position.y = 0.4 + (playerHeight - 0.4) * riseProgress;
          if (phaseElapsed >= 1.5) {
            camera.position.y = playerHeight;
            setStatus('rest', 100);
            setStatus('hunger', playerStatus.hunger - 15);
            sleeping = false;
            sleepState = null;
            updatePointerUi();
          }
        }

        function updateContextHint() {
          const currentLocation = isInsideCabin ? 'indoor' : 'outdoor';
          for (let i = 0; i < interactionZones.length; i += 1) {
            const zone = interactionZones[i];
            const shouldBeVisible = zone.userData.location === currentLocation;
            zone.visible = shouldBeVisible;
            if (!shouldBeVisible) setZoneMarkerActive(zone, false);
          }

          if (activeInteractionZone && !activeInteractionZone.visible) {
            setZoneMarkerActive(activeInteractionZone, false);
            activeInteractionZone = null;
          }

          if (
            sleeping ||
            cooking ||
            fishingState ||
            stargazingState ||
            brewingTea ||
            readingState ||
            eatPopup.classList.contains('is-open') ||
            cookPopup.classList.contains('is-open')

            setZoneMarkerActive(activeInteractionZone, false);
            activeInteractionZone = null;
            contextHint.classList.remove('is-visible');
            contextHint.setAttribute('aria-hidden', 'true');
            return;
          }

          let nearestZone = null;
          let nearestDistanceSquared = Infinity;

          for (let i = 0; i < interactionZones.length; i += 1) {
            const zone = interactionZones[i];
            if (!zone.visible) continue;
            zone.getWorldPosition(hintWorldPosition);
            const distanceSquared = camera.position.distanceToSquared(
              hintWorldPosition
            );
            const triggerRadius = zone.userData.triggerRadius;

            if (
              distanceSquared <= triggerRadius * triggerRadius &&
              distanceSquared < nearestDistanceSquared
            ) {
              nearestDistanceSquared = distanceSquared;
              nearestZone = zone;
            }
          }

          if (nearestZone === activeInteractionZone) return;
          setZoneMarkerActive(activeInteractionZone, false);
          activeInteractionZone = nearestZone;
          setZoneMarkerActive(activeInteractionZone, true);

          if (activeInteractionZone) {
            contextHint.textContent = zoneHints[activeInteractionZone.userData.zone];
            contextHint.classList.add('is-visible');
            contextHint.setAttribute('aria-hidden', 'false');

            contextHint.classList.remove('is-visible');
            contextHint.setAttribute('aria-hidden', 'true');
          }

        function createSoftCelestialPointTexture() {

          glow.addColorStop(0.24, 'rgba(255, 255, 255, 0.95)');
          glow.addColorStop(0.58, 'rgba(255, 255, 255, 0.3)');
          glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
          context.fillStyle = glow;
          context.fillRect(0, 0, 64, 64);
          return new THREE.CanvasTexture(canvas);

        function resetLayeredSnowflake(layer, index, initialPlacement) {
          const offset = index * 3;
          const x =
            camera.position.x + (Math.random() - 0.5) * layer.spread;
          const z =
            camera.position.z + (Math.random() - 0.5) * layer.spread;

          layer.positions[offset] = x;
          layer.positions[offset + 1] = initialPlacement
            ? terrainHeight + Math.random() * layer.topHeight
            : Math.max(camera.position.y + layer.topHeight * 0.55, terrainHeight) +
              Math.random() * layer.topHeight * 0.45;
          layer.positions[offset + 2] = z;
          layer.sizes[index] =
            layer.sizeMin + Math.random() * (layer.sizeMax - layer.sizeMin);
          layer.fallSpeeds[index] =
            layer.fallMin + Math.random() * (layer.fallMax - layer.fallMin);
          layer.frequencies[index] =
            layer.frequencyMin +
            Math.random() * (layer.frequencyMax - layer.frequencyMin);
          layer.phases[index] = Math.random() * Math.PI * 2;
        }

        function createSnowLayer(config) {
          const material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffff,
            emissiveIntensity: 0.85,
            roughness: 1,
            metalness: 0,
            map: celestialPointTexture,
            emissiveMap: celestialPointTexture,
            transparent: true,

            alphaTest: 0.025,
            depthWrite: false,
            side: THREE.DoubleSide
          });
          const mesh = new THREE.InstancedMesh(
            snowBillboardGeometry,
            material,
            config.count
          );
          mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
          mesh.frustumCulled = false;
          mesh.castShadow = false;
          mesh.receiveShadow = false;
          mesh.renderOrder = 4;
          const layer = {
            ...config,
            mesh,
            positions: new Float32Array(config.count * 3),
            sizes: new Float32Array(config.count),
            fallSpeeds: new Float32Array(config.count),
            frequencies: new Float32Array(config.count),
            phases: new Float32Array(config.count)
          };

          for (let i = 0; i < config.count; i += 1) {
            resetLayeredSnowflake(layer, i, true);
          }
          snowLayers.push(layer);
          scene.add(mesh);
          return layer;
        }

        createSnowLayer({

        function updateSnowLayer(layer, elapsed, delta, windStrength) {
          const halfSpread = layer.spread * 0.5;
          for (let i = 0; i < layer.count; i += 1) {
            const offset = i * 3;
            layer.positions[offset] +=
              windDirection.x * layer.windSpeed * windStrength * delta;
            layer.positions[offset + 1] -= layer.fallSpeeds[i] * delta;
            layer.positions[offset + 2] +=
              windDirection.z * layer.windSpeed * windStrength * delta;

            if (layer.positions[offset] - camera.position.x > halfSpread) {
              layer.positions[offset] -= layer.spread;
            } else if (
              layer.positions[offset] - camera.position.x < -halfSpread
            ) {
              layer.positions[offset] += layer.spread;
            }
            if (layer.positions[offset + 2] - camera.position.z > halfSpread) {
              layer.positions[offset + 2] -= layer.spread;
            } else if (
              layer.positions[offset + 2] - camera.position.z < -halfSpread
            ) {
              layer.positions[offset + 2] += layer.spread;
            }

            const sway =
              Math.sin(elapsed * layer.frequencies[i] + layer.phases[i]) *
              layer.swayAmount;
            const displayX = layer.positions[offset] + sway;
            const displayZ = layer.positions[offset + 2];
            const terrainHeight = getTerrainHeightAt(displayX, displayZ);
            if (layer.positions[offset + 1] < terrainHeight) {
              resetLayeredSnowflake(layer, i, false);
            }

            snowInstancePosition.set(
              layer.positions[offset] + sway,
              layer.positions[offset + 1],
              layer.positions[offset + 2]
            );
            snowInstanceScale.setScalar(layer.sizes[i]);
            snowInstanceMatrix.compose(
              snowInstancePosition,
              camera.quaternion,
              snowInstanceScale
            );
            layer.mesh.setMatrixAt(i, snowInstanceMatrix);
          }
          layer.mesh.instanceMatrix.needsUpdate = true;
        }

        function updateWindSway(elapsed, windStrength) {
          const swayLimit = THREE.MathUtils.degToRad(2.2) * windStrength;

          for (let i = 0; i < treeInstanceData.length; i += 1) {
            const treeData = treeInstanceData[i];
            const swayX =
              Math.sin(elapsed * 0.85 + treeData.windOffset) * swayLimit;
            const swayZ =
              Math.cos(elapsed * 0.72 + treeData.windOffset + 1.15) *
              swayLimit;

            treePosition.set(treeData.x, treeData.y, treeData.z);
            treeEuler.set(
              treeData.leanX,
              treeData.rotation,
              treeData.leanZ,
              'YXZ'
            );
            treeQuaternion.setFromEuler(treeEuler);
            treeScale.setScalar(treeData.scale);
            treeBaseMatrix.compose(treePosition, treeQuaternion, treeScale);

            const tierCount = treeData.tierCount;
            for (let tierIndex = 0; tierIndex < tierCount; tierIndex += 1) {
              const tierProgress = tierIndex / Math.max(1, tierCount - 1);
              const variation = treeData.tierVariations[tierIndex];
              const tierRadius =
                THREE.MathUtils.lerp(2.55, 0.68, tierProgress) *
                variation.radius;
              const tierHeight =
                THREE.MathUtils.lerp(3.55, 1.55, tierProgress) *
                variation.height;
              const tierY =
                2.45 + tierIndex * (6.25 / Math.max(1, tierCount - 1));

              const swayFactor = tierProgress * tierProgress;
              const curSwayX = swayX * swayFactor;
              const curSwayZ = swayZ * swayFactor;

              treeLocalPosition.set(0, tierY, 0);
              treeLocalEuler.set(
                curSwayX,
                variation.rotation,
                curSwayZ,
                'YXZ'
              );
              treeLocalQuaternion.setFromEuler(treeLocalEuler);
              treeLocalScale.set(tierRadius, tierHeight, tierRadius);
              treeLocalMatrix.compose(
                treeLocalPosition,
                treeLocalQuaternion,
                treeLocalScale
              );
              treeWorldMatrix.multiplyMatrices(treeBaseMatrix, treeLocalMatrix);
              fullFoliageBatches[tierIndex].setMatrixAt(i, treeWorldMatrix);

              const snowLoadScale = 0.68 + treeData.snowLoad * 0.32;
              treeLocalPosition.set(0, tierY + tierHeight * 0.36, 0);
              treeLocalEuler.set(
                curSwayX,
                variation.rotation + variation.snowRotation,
                curSwayZ,
                'YXZ'
              );
              treeLocalQuaternion.setFromEuler(treeLocalEuler);
              treeLocalScale.set(
                tierRadius * 1.04 * variation.snowX * snowLoadScale,
                tierHeight * 0.28 * variation.snowY,
                tierRadius * 1.04 * variation.snowZ * snowLoadScale
              );
              treeLocalMatrix.compose(
                treeLocalPosition,
                treeLocalQuaternion,
                treeLocalScale
              );
              treeWorldMatrix.multiplyMatrices(treeBaseMatrix, treeLocalMatrix);
              fullSnowBatches[tierIndex].setMatrixAt(i, treeWorldMatrix);

              fullFoliageBatches[tierIndex].setColorAt(
                i,
                treeData.foliageColor
              );
              fullSnowBatches[tierIndex].setColorAt(i, treeData.snowColor);
            }
          }

          for (let tierIndex = 0; tierIndex < MAX_TREE_TIERS; tierIndex += 1) {
            fullFoliageBatches[tierIndex].instanceMatrix.needsUpdate = true;
            fullSnowBatches[tierIndex].instanceMatrix.needsUpdate = true;
            if (fullFoliageBatches[tierIndex].instanceColor) {
              fullFoliageBatches[tierIndex].instanceColor.needsUpdate = true;
            }
            if (fullSnowBatches[tierIndex].instanceColor) {
              fullSnowBatches[tierIndex].instanceColor.needsUpdate = true;
            }
            fullFoliageBatches[tierIndex].castShadow = !isInsideCabin;
          }
          treeTrunkInstances.castShadow = !isInsideCabin;
        }

        const cloudMaterial = new THREE.MeshStandardMaterial({

        const cloudSphereGeometry = new THREE.SphereGeometry(1, 16, 10);
        const cloudLayer = new THREE.Group();

        cloudLayer.visible = false;
        const cloudGroups = [];
        const CLOUD_COUNT = 8 + Math.floor(Math.random() * 5);
        let cloudPuffTotal = 0;

        for (let cloudIndex = 0; cloudIndex < CLOUD_COUNT; cloudIndex += 1) {
          const puffCount = 5 + Math.floor(Math.random() * 4);
          const cloud = {
            position: new THREE.Vector3(

          };
          for (let puffIndex = 0; puffIndex < puffCount; puffIndex += 1) {
            const puffScale = 3.8 + Math.random() * 4.8;
            cloud.puffs.push({
              position: new THREE.Vector3(
                (puffIndex - (puffCount - 1) * 0.5) *
                  (2.7 + Math.random()),
                (Math.random() - 0.5) * 3.4,
                (Math.random() - 0.5) * 5.5
              ),
              scale: new THREE.Vector3(
                puffScale * (1.2 + Math.random() * 0.65),
                puffScale * (0.42 + Math.random() * 0.24),
                puffScale * (0.75 + Math.random() * 0.45)
              )
            });
            cloudPuffTotal += 1;
          }
          cloudGroups.push(cloud);
        }
        const cloudPuffMesh = new THREE.InstancedMesh(
          cloudSphereGeometry,
          cloudMaterial,
          cloudPuffTotal
        );
        cloudPuffMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        cloudPuffMesh.castShadow = false;
        cloudPuffMesh.receiveShadow = false;
        cloudPuffMesh.frustumCulled = false;
        cloudLayer.add(cloudPuffMesh);
        scene.add(cloudLayer);

        const cloudGroupMatrix = new THREE.Matrix4();
        const cloudPuffMatrix = new THREE.Matrix4();
        const cloudWorldMatrix = new THREE.Matrix4();
        const cloudQuaternion = new THREE.Quaternion();
        const cloudIdentityQuaternion = new THREE.Quaternion();
        const cloudUnitScale = new THREE.Vector3(1, 1, 1);
        const cloudEuler = new THREE.Euler();

        function updateCloudLayer(delta, windStrength) {
          let cloudInstanceIndex = 0;
          for (let i = 0; i < cloudGroups.length; i += 1) {
            const cloud = cloudGroups[i];
            cloud.position.x +=
              windDirection.x * cloud.driftSpeed * windStrength * delta;
            cloud.position.z +=
              windDirection.z * cloud.driftSpeed * windStrength * delta;
            if (cloud.position.x > 110) cloud.position.x = -110;
            if (cloud.position.x < -110) cloud.position.x = 110;
            if (cloud.position.z > 110) cloud.position.z = -110;
            if (cloud.position.z < -110) cloud.position.z = 110;
            cloudEuler.set(0, cloud.rotation, 0);
            cloudQuaternion.setFromEuler(cloudEuler);
            cloudGroupMatrix.compose(
              cloud.position,
              cloudQuaternion,
              cloudUnitScale
            );
            for (let puffIndex = 0; puffIndex < cloud.puffs.length; puffIndex += 1) {
              const puff = cloud.puffs[puffIndex];
              cloudPuffMatrix.compose(
                puff.position,
                cloudIdentityQuaternion,
                puff.scale
              );
              cloudWorldMatrix.multiplyMatrices(
                cloudGroupMatrix,
                cloudPuffMatrix
              );
              cloudPuffMesh.setMatrixAt(
                cloudInstanceIndex,
                cloudWorldMatrix
              );
              cloudInstanceIndex += 1;
            }
          }
          cloudPuffMesh.instanceMatrix.needsUpdate = true;
        }

        const clock = new THREE.Clock();
        const FRAME_INTERVAL = 1000 / 60;
        const FRAME_TOLERANCE = 0.1;
        let lastFrameTimestamp = performance.now();

        function animate(frameTimestamp) {
          requestAnimationFrame(animate);

          const frameElapsed = frameTimestamp - lastFrameTimestamp;
          if (frameElapsed + FRAME_TOLERANCE < FRAME_INTERVAL) return;
          lastFrameTimestamp =
            frameTimestamp - (frameElapsed % FRAME_INTERVAL);

          const delta = Math.min(clock.getDelta(), 0.05);
          const elapsed = clock.elapsedTime;
          updateFishingHoleRipple(elapsed);

          if (sleeping) {
            updateSleepSequence(elapsed);
          } else if (fishingState) {
            updateFishing(elapsed);
          } else if (stargazingState) {
            updateStargazingCamera(elapsed);
          } else if (brewingTea || readingState) {
            playerIsMoving = false;
            camera.position.y = playerHeight;
          } else {
            updatePlayerMovement(elapsed, delta);
          }
          updateBreathEffect(elapsed, delta, playerIsMoving);
          updateLensCondensation(elapsed);
          updateEnergyFloat(delta);
          updateCabinInteriorLighting(elapsed, delta);
          updateMountainLOD();
          updateMoonCascadeShadows();
          updateDynamicShadowSystem();
          const windStrength =
            Math.sin(elapsed * 0.05) * 0.3 + 0.7;
          for (let i = 0; i < snowLayers.length; i += 1) {
            updateSnowLayer(snowLayers[i], elapsed, delta, windStrength);
          }
          updateWindSway(elapsed, windStrength);
          updateCloudLayer(delta, windStrength);

          for (let i = 0; i < SMOKE_COUNT; i += 1) {
            const puff = smokePuffs[i];
            puff.userData.age += delta;
            if (puff.userData.age >= puff.userData.life) {
              resetSmokePuff(puff, false);
            } else {
              placeSmokePuff(puff);
            }
          }
          smokePuffMesh.instanceMatrix.needsUpdate = true;

          for (let i = 0; i < POT_STEAM_COUNT; i += 1) {
            const puff = potSteamPuffs[i];
            puff.userData.age += delta;
            if (puff.userData.age >= puff.userData.life) {
              resetPotSteamPuff(puff, false);
            } else {
              placePotSteamPuff(puff);
            }
          }

          for (let i = 0; i < MUG_STEAM_COUNT; i += 1) {
            const puff = mugSteamPuffs[i];
            puff.userData.age += delta;
            if (puff.userData.age >= puff.userData.life) {
              resetMugSteamPuff(puff, false);
            } else {
              placeMugSteamPuff(puff);
            }
          }

          updateDayNightCycle(performance.now());
          updateAuroraLightContribution(elapsed);
          const fireFlickerFactor =
            1 + Math.sin(elapsed * 8.15 + 0.2) * 0.17;
          const fireMidFlickerFactor =
            1 + Math.sin(elapsed * 6.35 + 1.65) * 0.2;
          const fireOuterFlickerFactor =
            1 + Math.sin(elapsed * 4.7 + 3.1) * 0.14;
          fireLight.intensity =
            10 * fireFlickerFactor *
            campfireLightMultiplier *
            campfireInteriorMultiplier;
          fireMidLight.intensity =
            4 *
            fireMidFlickerFactor *
            campfireLightMultiplier *
            campfireInteriorMultiplier;
          fireOuterLight.intensity =
            2 *
            fireOuterFlickerFactor *
            campfireLightMultiplier *
            campfireInteriorMultiplier;
          campfireBounceLight.intensity =
            (1.2 + Math.sin(elapsed * 6.7 + 0.8) * 0.16) *
            campfireLightMultiplier *
            campfireInteriorMultiplier;
          updateSnowSubsurfaceScattering();
          updateLensflareVisibility(fireFlickerFactor);
          updateLightProbeIrradiance();
          updateVolumetricLightShafts(fireFlickerFactor);
          updateInteriorWindowLightShafts(elapsed);
          updateIceEnvironmentMap(elapsed, fireFlickerFactor);
          materialLightingFrame = (materialLightingFrame + 1) % 10;
          if (materialLightingFrame === 0) {
            updateDynamicMaterialResponses(elapsed, fireFlickerFactor);
          }
          updateSnowSparkles(elapsed);
          for (let i = 0; i < FIRE_PARTICLE_COUNT; i += 1) {
            const particle = fireParticles[i];
            particle.userData.age += delta;
            if (particle.userData.age >= particle.userData.life) {
              resetFireParticle(particle, false);
            } else {
              placeFireParticle(particle);
            }
          }
          fireParticleMesh.instanceMatrix.needsUpdate = true;
          fireParticleMesh.instanceColor.needsUpdate = true;

          for (let i = 0; i < auroraMaterials.length; i += 1) {
            auroraMaterials[i].uniforms.time.value = elapsed;
          }
          updateStarTwinkle(elapsed);

          for (let i = 0; i < interactionZones.length; i += 1) {
            const zone = interactionZones[i];
            if (!zone.visible) continue;
            const pulse = 1 + Math.sin(elapsed * 2.4 + zone.userData.phase) * 0.2;
            zone.scale.setScalar(pulse);
          }

          updateContextHint();
          drawMinimap();

          colorGradingPass.uniforms.time.value = elapsed;
          depthOfFieldPass.uniforms.stargazing.value =
            stargazingState ? stargazeVisualAmount : 0;
          composer.render();
        }

        function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          const pixelRatio = Math.min(window.devicePixelRatio, 2);
          renderer.setPixelRatio(pixelRatio);
          renderer.setSize(window.innerWidth, window.innerHeight);
          composer.setPixelRatio(pixelRatio);
          composer.setSize(window.innerWidth, window.innerHeight);
          depthOfFieldPass.uniforms.resolution.value.set(
            window.innerWidth * pixelRatio,
            window.innerHeight * pixelRatio
          );
          chromaticAberrationPass.uniforms.resolution.value.set(
            window.innerWidth * pixelRatio,
            window.innerHeight * pixelRatio
          );
        }

        window.addEventListener('resize', onResize, { passive: true });
        renderer.domElement.addEventListener('click', onSceneClick);
        controls.addEventListener('lock', updatePointerUi);
        controls.addEventListener('unlock', onPointerUnlock);
        window.addEventListener('keydown', onMovementKeyDown);
        window.addEventListener('keydown', onInteractionKeyDown);
        window.addEventListener('keyup', onMovementKeyUp);
        eatClose.addEventListener('click', () => {
          closeEatPanel();
        });
        eatPopup.addEventListener('click', (event) => {
          if (event.target === eatPopup) {
            closeEatPanel();
          }
        });
        cookClose.addEventListener('click', () => {
          closeCookPanel();
        });
        cookPopup.addEventListener('click', (event) => {
          if (event.target === cookPopup) {
            closeCookPanel();
          }
        });
        window.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            cancelFishing();
            beginStargazeReturn();
            endReading();
            closeEatPanel();
            closeCookPanel();
          }
        });
        updateColdEffects(playerStatus.warmth);
        updatePointerUi();
        window.setInterval(() => {
          setStatus('warmth', playerStatus.warmth - 5);
          setStatus('hunger', playerStatus.hunger - 3);
        }, 30000);
        window.setInterval(() => {
          campfire.getWorldPosition(campfireWorldPosition);
          const deltaX = camera.position.x - campfireWorldPosition.x;
          const deltaZ = camera.position.z - campfireWorldPosition.z;
          const distanceSquared = deltaX * deltaX + deltaZ * deltaZ;
          if (distanceSquared <= campfireWarmDistanceSquared) {
            setStatus('warmth', playerStatus.warmth + 2);
          }
        }, 10000);
        updateDayNightCycle(performance.now());
        initializeSnowSubsurfaceScattering();
        updateAuroraLightContribution(0);
        camera.updateMatrixWorld();
        updateSnowSubsurfaceScattering();
        prepareWoodMaterialResponses();
        updateDynamicMaterialResponses(0, 1);
        updateIceEnvironmentMap(0, 1);
        updateWindSway(0, 1);
        initializeLightProbeGI();
        updateLightProbeIrradiance();
        requestAnimationFrame(animate);
      })();
    </script>
  </body>
</html>
