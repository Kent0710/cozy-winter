<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winter Night</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0a0a1a;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .scene-shell {
        position: fixed;
        inset: 0;
      }

      .scene-shell::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 5;
        background: rgba(10, 18, 30, 0);
        backdrop-filter: blur(0);
        -webkit-mask-image: radial-gradient(circle, transparent 42%, #000 88%);
        mask-image: radial-gradient(circle, transparent 42%, #000 88%);
        transition: backdrop-filter 450ms ease, background 450ms ease;
        pointer-events: none;
      }

      .scene-shell.is-fishing::after {
        background: rgba(10, 18, 30, 0.08);
        backdrop-filter: blur(2px);
      }

      .hud,
      .context-hint,
      .sleep-overlay,
      .eat-popup {
        position: absolute;
        z-index: 10;
        color: #f5e6c8;
        font-family: 'Lora', serif;
        pointer-events: none;
        user-select: none;
      }

      .hud {
        top: 22px;
        left: 22px;
        display: grid;
        gap: 12px;
        padding: 14px 16px 16px;
        border-radius: 14px;
        background: rgba(9, 12, 24, 0.5);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(6px);
      }

      .status-row {
        display: grid;
        gap: 5px;
      }

      .status-label {
        display: grid;
        grid-template-columns: 20px 1fr auto;
        align-items: center;
        width: 120px;
        font-size: 12px;
        line-height: 1;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.75);
      }

      .status-value {
        color: rgba(245, 230, 200, 0.7);
        font-size: 10px;
      }

      .status-track {
        width: 120px;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(6, 8, 16, 0.78);
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      }

      .status-fill {
        width: var(--value);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #bd7637, #e2a94f);
        box-shadow: 0 0 8px rgba(226, 169, 79, 0.38);
        transition: width 500ms ease;
      }

      .context-hint {
        bottom: 7vh;
        left: 50%;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(9, 12, 24, 0.48);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
        font-size: clamp(14px, 1.6vw, 18px);
        letter-spacing: 0.025em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 350ms ease, transform 350ms ease;
        white-space: nowrap;
      }

      .context-hint.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .sleep-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #000;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 1.5s ease, visibility 0s linear 1.5s;
      }

      .sleep-overlay.is-dark {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition-delay: 0s;
      }

      .sleep-message {
        padding: 24px;
        font-size: clamp(20px, 3vw, 34px);
        font-weight: 500;
        letter-spacing: 0.025em;
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 600ms ease, transform 600ms ease;
      }

      .sleep-overlay.is-message-visible .sleep-message {
        opacity: 1;
        transform: translateY(0);
      }

      .eat-popup {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(4, 6, 14, 0.32);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 220ms ease, visibility 0s linear 220ms;
        backdrop-filter: blur(2px);
      }

      .eat-popup.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition-delay: 0s;
      }

      .eat-panel {
        position: relative;
        width: min(380px, calc(100vw - 40px));
        padding: 28px;
        border-radius: 18px;
        background: rgba(11, 15, 27, 0.93);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.46);
        text-align: center;
        transform: translateY(8px) scale(0.98);
        transition: transform 220ms ease;
      }

      .eat-popup.is-open .eat-panel {
        transform: translateY(0) scale(1);
      }

      .eat-panel p {
        margin: 4px 0;
        font-size: 16px;
        line-height: 1.65;
      }

      .cook-title {
        margin: 0 0 16px;
        font-size: 20px;
        font-weight: 500;
      }

      .eat-items {
        display: grid;
        gap: 9px;
        margin-top: 10px;
      }

      .eat-item,
      .eat-close {
        border: 0;
        color: #f5e6c8;
        font-family: 'Lora', serif;
        cursor: pointer;
      }

      .eat-item {
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(214, 151, 67, 0.12);
        font-size: 16px;
        transition: color 160ms ease, background 160ms ease;
      }

      .eat-item:hover,
      .eat-item:focus-visible {
        color: #ffd995;
        background: rgba(214, 151, 67, 0.22);
        outline: none;
      }

      .eat-item:disabled {
        color: rgba(245, 230, 200, 0.34);
        background: rgba(255, 255, 255, 0.035);
        cursor: not-allowed;
      }

      .cook-status {
        min-height: 24px;
        margin: 15px 0 0;
        color: #ffd68a;
        font-size: 14px;
      }

      .eat-close {
        position: absolute;
        top: 8px;
        right: 10px;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 50%;
        background: transparent;
        font-size: 24px;
        line-height: 34px;
        opacity: 0.68;
      }

      .eat-close:hover,
      .eat-close:focus-visible {
        opacity: 1;
        outline: none;
      }

      .fishing-status {
        position: fixed;
        bottom: 15vh;
        left: 50%;
        z-index: 45;
        min-width: 170px;
        padding: 11px 18px;
        border-radius: 999px;
        color: #f5e6c8;
        font-family: 'Lora', serif;
        font-size: clamp(15px, 1.8vw, 19px);
        text-align: center;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
        background: rgba(8, 14, 25, 0.66);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 300ms ease, transform 300ms ease;
        pointer-events: none;
      }

      .fishing-status.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .stargaze-message,
      .cold-reminder {
        position: fixed;
        left: 50%;
        z-index: 45;
        color: #f5e6c8;
        font-family: 'Lora', serif;
        text-align: center;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.92);
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 500ms ease, transform 500ms ease;
        pointer-events: none;
      }

      .stargaze-message {
        bottom: 8vh;
        width: min(620px, calc(100vw - 40px));
        font-size: clamp(16px, 2vw, 22px);
        font-style: italic;
      }

      .cold-reminder {
        bottom: 19vh;
        width: min(480px, calc(100vw - 40px));
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(18, 34, 62, 0.62);
        font-size: clamp(14px, 1.7vw, 18px);
      }

      .stargaze-message.is-visible,
      .cold-reminder.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .reading-overlay {
        position: fixed;
        inset: 0;
        z-index: 46;
        display: grid;
        place-items: center;
        padding: 28px;
        color: #f5e6c8;
        font-family: 'Lora', serif;
        background: rgba(42, 22, 10, 0.12);
        box-shadow: inset 0 0 180px rgba(224, 136, 56, 0.28);
        opacity: 0;
        visibility: hidden;
        transition: opacity 450ms ease, visibility 0s linear 450ms;
        pointer-events: none;
      }

      .reading-overlay.is-visible {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      .reading-entry {
        width: min(680px, calc(100vw - 48px));
        padding: 28px 32px;
        border-radius: 18px;
        background: rgba(31, 18, 10, 0.72);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.32);
        font-size: clamp(16px, 2vw, 22px);
        font-style: italic;
        line-height: 1.75;
        text-align: center;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.78);
      }

      .reading-entry p {
        margin: 8px 0;
      }

      .cold-vignette {
        position: fixed;
        inset: 0;
        z-index: 30;
        box-shadow: inset 0 0 150px rgba(52, 119, 255, 0.72);
        opacity: 0;
        transition: opacity 1.2s ease;
        pointer-events: none;
      }

      .cold-vignette.is-cold {
        opacity: 0.52;
      }

      .lens-condensation {
        position: fixed;
        inset: 0;
        z-index: 9;
        background:
          radial-gradient(
            ellipse at 50% 82%,
            rgba(245, 250, 255, 0.2) 0%,
            rgba(235, 245, 255, 0.08) 24%,
            transparent 58%
          ),
          linear-gradient(
            to top,
            rgba(240, 248, 255, 0.09),
            transparent 44%
          );
        opacity: 0;
        backdrop-filter: blur(0);
        -webkit-backdrop-filter: blur(0);
        transition: opacity 700ms ease, backdrop-filter 700ms ease;
        pointer-events: none;
      }

      .lens-condensation.is-visible {
        opacity: 0.42;
        backdrop-filter: blur(0.7px);
        -webkit-backdrop-filter: blur(0.7px);
      }

      .immersion-vignette {
        position: fixed;
        inset: 0;
        z-index: 8;
        background: radial-gradient(
          circle at 50% 48%,
          transparent 46%,
          rgba(2, 5, 12, 0.12) 72%,
          rgba(1, 3, 9, 0.52) 100%
        );
        box-shadow: inset 0 0 95px rgba(2, 5, 12, 0.42);
        opacity: 0.48;
        pointer-events: none;
      }

      .crosshair,
      .explore-prompt {
        position: fixed;
        left: 50%;
        z-index: 42;
        color: #f5e6c8;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .crosshair {
        top: 50%;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 24px;
        font-weight: 300;
        line-height: 1;
        text-shadow: 0 0 7px rgba(255, 255, 255, 0.65);
        transform: translate(-50%, -50%);
      }

      .explore-prompt {
        top: 50%;
        padding: 11px 20px;
        border-radius: 999px;
        background: rgba(8, 12, 23, 0.62);
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        font-family: 'Lora', serif;
        font-size: clamp(16px, 2vw, 21px);
        transform: translate(-50%, -50%);
      }

      .crosshair.is-visible,
      .explore-prompt.is-visible {
        opacity: 1;
      }

      .minimap {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 20;
        width: 100px;
        height: 100px;
        border-radius: 13px;
        background: rgba(7, 12, 22, 0.72);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.34);
        pointer-events: none;
      }

      .cycle-clock {
        position: fixed;
        top: 20px;
        right: 22px;
        z-index: 20;
        min-width: 58px;
        padding: 7px 11px;
        border-radius: 999px;
        color: #f5e6c8;
        font-family: 'Lora', serif;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-align: center;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
        background: rgba(8, 12, 23, 0.5);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22);
        pointer-events: none;
        user-select: none;
      }

      @media (max-width: 520px) {
        .hud {
          top: 14px;
          left: 14px;
          padding: 12px 14px 14px;
        }

        .context-hint {
          bottom: 5vh;
        }

        .minimap {
          right: 14px;
          bottom: 14px;
        }

        .cycle-clock {
          top: 14px;
          right: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene-shell" class="scene-shell"></div>
    <div class="hud" aria-label="Player status">
      <div class="status-row">
        <div class="status-label">
          <span aria-hidden="true">🍞</span><span>Hunger</span><span id="hunger-value" class="status-value">80%</span>
        </div>
        <div id="hunger-track" class="status-track" role="progressbar" aria-label="Hunger" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
          <div id="hunger-fill" class="status-fill" style="--value: 80%"></div>
        </div>
      </div>
      <div class="status-row">
        <div class="status-label">
          <span aria-hidden="true">🔥</span><span>Warmth</span><span id="warmth-value" class="status-value">90%</span>
        </div>
        <div id="warmth-track" class="status-track" role="progressbar" aria-label="Warmth" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">
          <div id="warmth-fill" class="status-fill" style="--value: 90%"></div>
        </div>
      </div>
      <div class="status-row">
        <div class="status-label">
          <span aria-hidden="true">😴</span><span>Rest</span><span id="rest-value" class="status-value">100%</span>
        </div>
        <div id="rest-track" class="status-track" role="progressbar" aria-label="Rest" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <div id="rest-fill" class="status-fill" style="--value: 100%"></div>
        </div>
      </div>
    </div>
    <div id="context-hint" class="context-hint" aria-live="polite" aria-hidden="true"></div>
    <div id="sleep-overlay" class="sleep-overlay" aria-hidden="true">
      <div class="sleep-message">You slept peacefully...</div>
    </div>
    <div id="eat-popup" class="eat-popup" aria-hidden="true">
      <div class="eat-panel" role="dialog" aria-modal="true" aria-label="Food pouch">
        <button id="eat-close" class="eat-close" type="button" aria-label="Close">×</button>
        <div id="eat-content"></div>
      </div>
    </div>
    <div id="cook-popup" class="eat-popup" aria-hidden="true">
      <div class="eat-panel" role="dialog" aria-modal="true" aria-label="Campfire cooking">
        <button id="cook-close" class="eat-close" type="button" aria-label="Close">×</button>
        <h2 id="cook-title" class="cook-title">Campfire cooking</h2>
        <div id="cook-content" class="eat-items"></div>
        <p id="cook-status" class="cook-status" aria-live="polite"></p>
      </div>
    </div>
    <div id="fishing-status" class="fishing-status" aria-live="polite" aria-hidden="true"></div>
    <div id="coffee-status" class="fishing-status" aria-live="polite" aria-hidden="true"></div>
    <div id="stargaze-message" class="stargaze-message" aria-hidden="true">
      The sky stretches endlessly above you...
    </div>
    <div id="reading-overlay" class="reading-overlay" aria-live="polite" aria-hidden="true">
      <div id="reading-entry" class="reading-entry"></div>
    </div>
    <div id="cold-vignette" class="cold-vignette" aria-hidden="true"></div>
    <div class="immersion-vignette" aria-hidden="true"></div>
    <div id="lens-condensation" class="lens-condensation" aria-hidden="true"></div>
    <div id="cold-reminder" class="cold-reminder" aria-live="polite" aria-hidden="true">
      You're very cold... tend to the fire 🔥
    </div>
    <div id="crosshair" class="crosshair" aria-hidden="true">+</div>
    <div id="explore-prompt" class="explore-prompt is-visible">Click to explore</div>
    <canvas id="minimap" class="minimap" width="100" height="100" aria-label="Scene minimap"></canvas>
    <div id="cycle-clock" class="cycle-clock" aria-live="polite">Night</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Lensflare.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lights/LightProbeGenerator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lights/RectAreaLightUniformsLib.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/SimplexNoise.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/SSAOShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/SMAAShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/SSAOPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/SMAAPass.js"></script>
    <script>
      (() => {
        'use strict';

        const SKY_COLOR = 0x0a0a1a;
        const FOG_COLOR = 0x0d0d2a;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(SKY_COLOR);
        scene.fog = new THREE.FogExp2(FOG_COLOR, 0.012);

        const camera = new THREE.PerspectiveCamera(
          52,
          window.innerWidth / window.innerHeight,
          0.1,
          420
        );

        const renderer = new THREE.WebGLRenderer({
          antialias: false,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.75;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.autoUpdate = false;
        renderer.physicallyCorrectLights = true;
        renderer.setClearColor(SKY_COLOR, 1);
        const sceneShell = document.getElementById('scene-shell');
        sceneShell.appendChild(renderer.domElement);

        const controls = new THREE.PointerLockControls(camera, renderer.domElement);
        camera.position.set(3, 1.7, 14);
        camera.lookAt(new THREE.Vector3(-14, 1.4, 1.1));
        scene.add(controls.getObject());

        const sky = new THREE.Sky();
        sky.scale.setScalar(400);
        sky.renderOrder = -1000;
        const skyUniforms = sky.material.uniforms;
        skyUniforms.turbidity.value = 0.5;
        skyUniforms.rayleigh.value = 0.8;
        skyUniforms.mieCoefficient.value = 0.003;
        skyUniforms.mieDirectionalG.value = 0.9;
        const skySunPosition = new THREE.Vector3();
        scene.background = null;
        scene.add(sky);

        const composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        const ssaoPass = new THREE.SSAOPass(
          scene,
          camera,
          window.innerWidth,
          window.innerHeight
        );
        ssaoPass.kernelRadius = 0.6;
        ssaoPass.minDistance = 0.001;
        ssaoPass.maxDistance = 0.06;
        ssaoPass.output = THREE.SSAOPass.OUTPUT.Default;
        const setSSAONativeSize = ssaoPass.setSize.bind(ssaoPass);
        ssaoPass.setSize = (width, height) => {
          setSSAONativeSize(
            Math.max(1, Math.floor(width * 0.5)),
            Math.max(1, Math.floor(height * 0.5))
          );
        };

        const volumetricScatterShader = {
          uniforms: {
            tDiffuse: { value: null },
            tDepth: { value: null },
            moonScreenPosition: { value: new THREE.Vector2(0.5, 0.8) },
            fireScreenPosition: { value: new THREE.Vector2(0.5, 0.5) },
            moonTint: { value: new THREE.Color(0xc8d8ff) },
            fireTint: { value: new THREE.Color(0xff8833) },
            moonIntensity: { value: 0 },
            fireIntensity: { value: 0 },
            moonDecay: { value: 0.94 },
            fireDecay: { value: 0.88 }
          },
          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform sampler2D tDepth;
            uniform vec2 moonScreenPosition;
            uniform vec2 fireScreenPosition;
            uniform vec3 moonTint;
            uniform vec3 fireTint;
            uniform float moonIntensity;
            uniform float fireIntensity;
            uniform float moonDecay;
            uniform float fireDecay;
            varying vec2 vUv;

            vec3 gatherLightShaft(
              vec2 lightPosition,
              vec3 tint,
              float sourceIntensity,
              float decay,
              float rayLength,
              float upwardColumn
            ) {
              if (sourceIntensity <= 0.0001) return vec3(0.0);

              vec2 sampleStep =
                (vUv - lightPosition) * (rayLength / 32.0);
              vec2 sampleUv = vUv;
              float attenuation = 1.0;
              float accumulatedWeight = 0.0;
              vec3 accumulatedLight = vec3(0.0);

              for (int sampleIndex = 0; sampleIndex < 32; sampleIndex += 1) {
                sampleUv -= sampleStep;
                if (
                  sampleUv.x <= 0.0 || sampleUv.x >= 1.0 ||
                  sampleUv.y <= 0.0 || sampleUv.y >= 1.0
                ) {
                  break;
                }

                vec3 sceneSample = texture2D(tDiffuse, sampleUv).rgb;
                float sceneDepth = texture2D(tDepth, sampleUv).x;
                float luminance = dot(
                  sceneSample,
                  vec3(0.2126, 0.7152, 0.0722)
                );
                float openAtmosphere = smoothstep(0.965, 1.0, sceneDepth);
                float particleScatter = smoothstep(0.08, 0.72, luminance);
                float solidOcclusion = mix(0.16, 1.0, openAtmosphere);
                float scatterAmount =
                  (0.025 + particleScatter * 0.48) * solidOcclusion;

                accumulatedLight +=
                  (tint * (0.45 + luminance * 0.8) + sceneSample * 0.16) *
                  scatterAmount *
                  attenuation;
                accumulatedWeight += attenuation;
                attenuation *= decay;
              }

              float columnMask = mix(
                1.0,
                smoothstep(-0.04, 0.34, vUv.y - lightPosition.y),
                upwardColumn
              );
              return accumulatedLight /
                max(accumulatedWeight, 0.0001) *
                sourceIntensity *
                columnMask;
            }

            void main() {
              vec3 moonShaft = gatherLightShaft(
                moonScreenPosition,
                moonTint,
                moonIntensity,
                moonDecay,
                1.0,
                0.0
              );
              vec3 fireShaft = gatherLightShaft(
                fireScreenPosition,
                fireTint,
                fireIntensity,
                fireDecay,
                0.48,
                1.0
              );
              gl_FragColor = vec4(moonShaft + fireShaft, 1.0);
            }
          `
        };

        const volumetricCompositeShader = {
          uniforms: {
            tDiffuse: { value: null },
            tLightShafts: { value: null },
            tPreviousLightShafts: { value: null },
            temporalBlend: { value: 0 },
            historyUvOffset: { value: new THREE.Vector2() },
            blendWeight: { value: 0.08 }
          },
          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform sampler2D tLightShafts;
            uniform sampler2D tPreviousLightShafts;
            uniform float temporalBlend;
            uniform vec2 historyUvOffset;
            uniform float blendWeight;
            varying vec2 vUv;

            void main() {
              vec4 sceneColor = texture2D(tDiffuse, vUv);
              vec3 currentShafts = texture2D(tLightShafts, vUv).rgb;
              vec3 previousShafts = texture2D(
                tPreviousLightShafts,
                clamp(vUv + historyUvOffset, 0.0, 1.0)
              ).rgb;
              vec3 shafts = mix(
                currentShafts,
                previousShafts,
                temporalBlend
              );
              gl_FragColor = vec4(
                sceneColor.rgb + shafts * blendWeight,
                sceneColor.a
              );
            }
          `
        };

        class VolumetricLightShaftsShaderPass extends THREE.ShaderPass {
          constructor(depthTexture) {
            super(volumetricCompositeShader);
            this.scatterMaterial = new THREE.ShaderMaterial({
              uniforms: THREE.UniformsUtils.clone(
                volumetricScatterShader.uniforms

              vertexShader: volumetricScatterShader.vertexShader,
              fragmentShader: volumetricScatterShader.fragmentShader,
              depthTest: false,
              depthWrite: false,
              blending: THREE.NoBlending

            this.scatterUniforms = this.scatterMaterial.uniforms;
            const targetOptions = {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                type: THREE.UnsignedByteType,
                depthBuffer: false,
                stencilBuffer: false

            this.scatterTargets = [
              new THREE.WebGLRenderTarget(
                Math.max(1, Math.floor(window.innerWidth * 0.5)),
                Math.max(1, Math.floor(window.innerHeight * 0.5)),
                targetOptions
              ),
              new THREE.WebGLRenderTarget(
                Math.max(1, Math.floor(window.innerWidth * 0.5)),
                Math.max(1, Math.floor(window.innerHeight * 0.5)),
                targetOptions

            this.scatterTargets[0].texture.name =
              'VolumetricLightShafts.CurrentHalfRes';
            this.scatterTargets[1].texture.name =
              'VolumetricLightShafts.HistoryHalfRes';
            this.scatterTargetIndex = 0;
            this.hasTemporalHistory = false;
            this.previousLightAnchor = new THREE.Vector2(0.5, 0.5);
            this.currentLightAnchor = new THREE.Vector2(0.5, 0.5);
            this.scatterQuad = new THREE.FullScreenQuad(
              this.scatterMaterial

            this.uniforms.tLightShafts.value =
              this.scatterTargets[0].texture;
            this.uniforms.tPreviousLightShafts.value =
              this.scatterTargets[1].texture;
          }

          setSize(width, height) {
            const halfWidth = Math.max(1, Math.floor(width * 0.5));
            const halfHeight = Math.max(1, Math.floor(height * 0.5));
            for (let i = 0; i < this.scatterTargets.length; i += 1) {
              this.scatterTargets[i].setSize(halfWidth, halfHeight);
            }
            this.hasTemporalHistory = false;
          }

          render(rendererToUse, writeBuffer, readBuffer) {
            const previousRenderTarget = rendererToUse.getRenderTarget();
            const currentTarget =
              this.scatterTargets[this.scatterTargetIndex];
            const historyTarget =
              this.scatterTargets[1 - this.scatterTargetIndex];
            this.scatterUniforms.tDiffuse.value = readBuffer.texture;
            rendererToUse.setRenderTarget(currentTarget);
            rendererToUse.clear(true, false, false);
            this.scatterQuad.render(rendererToUse);
            rendererToUse.setRenderTarget(previousRenderTarget);
            this.uniforms.tLightShafts.value = currentTarget.texture;
            this.uniforms.tPreviousLightShafts.value = historyTarget.texture;

              this.hasTemporalHistory ? 0.58 : 0;

              this.scatterUniforms.moonIntensity.value;
            const fireIntensity =
              this.scatterUniforms.fireIntensity.value;
            const lightTotal = Math.max(
              0.0001,
              moonIntensity + fireIntensity
            );
            this.currentLightAnchor
              .copy(this.scatterUniforms.moonScreenPosition.value)
              .lerp(
                this.scatterUniforms.fireScreenPosition.value,
                fireIntensity / lightTotal
              );
            this.uniforms.historyUvOffset.value
              .copy(this.previousLightAnchor)
              .sub(this.currentLightAnchor);
            super.render(rendererToUse, writeBuffer, readBuffer);
            this.previousLightAnchor.copy(this.currentLightAnchor);
            this.hasTemporalHistory = true;
            this.scatterTargetIndex = 1 - this.scatterTargetIndex;
          }

          dispose() {
            for (let i = 0; i < this.scatterTargets.length; i += 1) {

            this.scatterMaterial.dispose();
            this.scatterQuad.dispose();
          }
        }

        const volumetricLightPass = new VolumetricLightShaftsShaderPass(
          ssaoPass.beautyRenderTarget.depthTexture
        );
        const SSR_REFLECTIVE_LAYER = 1;

        const lightweightSSRRaymarchShader = {
          uniforms: {
            tDiffuse: { value: null },
            tDepth: { value: null },
            tNormal: { value: null },
            tReflectiveMask: { value: null },
            tReflectiveDepth: { value: null },
            cameraNear: { value: camera.near },
            cameraFar: { value: camera.far },
            cameraProjectionMatrix: { value: camera.projectionMatrix.clone() },
            cameraProjectionMatrixInverse: {
              value: camera.projectionMatrixInverse
            },
            sourceTexelSize: {
              value: new THREE.Vector2(
                1 / window.innerWidth,
                1 / window.innerHeight
              )
            },
            maxReflectionDistance: { value: 15 }
          },
          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform sampler2D tDepth;
            uniform sampler2D tNormal;
            uniform sampler2D tReflectiveMask;
            uniform sampler2D tReflectiveDepth;
            uniform float cameraNear;
            uniform float cameraFar;
            uniform mat4 cameraProjectionMatrix;
            uniform mat4 cameraProjectionMatrixInverse;
            uniform vec2 sourceTexelSize;
            uniform float maxReflectionDistance;
            varying vec2 vUv;

            vec3 reconstructViewPosition(vec2 uv, float depth) {
              vec4 clipPosition = vec4(uv * 2.0 - 1.0, depth * 2.0 - 1.0, 1.0);
              vec4 viewPosition = cameraProjectionMatrixInverse * clipPosition;
              return viewPosition.xyz / max(viewPosition.w, 0.00001);
            }

            vec2 projectToUv(vec3 viewPosition) {
              vec4 clipPosition = cameraProjectionMatrix * vec4(viewPosition, 1.0);
              return clipPosition.xy / max(clipPosition.w, 0.00001) * 0.5 + 0.5;
            }

            void main() {
              vec4 reflectiveData = texture2D(tReflectiveMask, vUv);
              if (reflectiveData.r < 0.5) {
                gl_FragColor = vec4(0.0);
                return;
              }

              float surfaceDepth = texture2D(tDepth, vUv).x;
              float reflectiveDepth = texture2D(tReflectiveDepth, vUv).x;
              vec3 surfacePosition = reconstructViewPosition(vUv, surfaceDepth);
              vec3 maskPosition = reconstructViewPosition(vUv, reflectiveDepth);

              // Reject reflective geometry hidden behind a nearer scene surface.
              if (abs(surfacePosition.z - maskPosition.z) > 0.12) {
                gl_FragColor = vec4(0.0);
                return;
              }

              vec3 surfaceNormal = normalize(
                texture2D(tNormal, vUv).xyz * 2.0 - 1.0
              );
              vec3 viewDirection = normalize(surfacePosition);
              vec3 reflectionDirection = normalize(
                reflect(viewDirection, surfaceNormal)
              );
              vec2 projectedEnd = projectToUv(
                surfacePosition + reflectionDirection * maxReflectionDistance
              );
              vec2 screenDirection = projectedEnd - vUv;
              float screenDirectionLength = length(screenDirection);

              if (screenDirectionLength < 0.0001) {
                gl_FragColor = vec4(0.0);
                return;
              }

              // Fixed 0.015 UV increments keep the half-resolution pass bounded.
              vec2 screenStep = normalize(screenDirection) * 0.015;
              float distanceStep = maxReflectionDistance / 32.0;
              vec2 rayUv = vUv;
              vec2 hitUv = vec2(-1.0);
              float rayDistance = 0.0;
              float fallbackReflection = 0.0;

              for (int stepIndex = 0; stepIndex < 32; stepIndex += 1) {
                rayUv += screenStep;
                rayDistance += distanceStep;

                if (
                  rayUv.x <= 0.0 || rayUv.x >= 1.0 ||
                  rayUv.y <= 0.0 || rayUv.y >= 1.0
                ) {
                  break;
                }

                float sceneDepth = texture2D(tDepth, rayUv).x;
                if (sceneDepth >= 0.99999) continue;
                vec3 scenePosition = reconstructViewPosition(rayUv, sceneDepth);
                vec3 rayPosition =
                  surfacePosition + reflectionDirection * rayDistance;
                float depthDelta = rayPosition.z - scenePosition.z;
                float hitThickness = max(0.1, rayDistance * 0.025);

                if (
                  rayDistance > 0.45 &&
                  depthDelta < 0.0 &&
                  depthDelta > -hitThickness
                ) {
                  hitUv = rayUv;
                  break;
                }
              }

              if (hitUv.x < 0.0) {
                // A faint directional color fallback lets the ice carry sky,
                // aurora and depth-write-free snow when no solid hit is found.
                float fallbackTravel = min(screenDirectionLength, 0.42);
                hitUv = vUv + normalize(screenDirection) * fallbackTravel;
                if (
                  hitUv.x <= 0.0 || hitUv.x >= 1.0 ||
                  hitUv.y <= 0.0 || hitUv.y >= 1.0
                ) {
                  gl_FragColor = vec4(0.0);
                  return;
                }
                fallbackReflection = 0.62;
              }

              float roughness = clamp(reflectiveData.g, 0.0, 1.0);
              vec2 blurOffset = sourceTexelSize * (1.0 + roughness * 10.0);
              vec3 reflectedColor = texture2D(tDiffuse, hitUv).rgb * 0.5;
              reflectedColor +=
                texture2D(tDiffuse, hitUv + vec2(blurOffset.x, 0.0)).rgb * 0.125;
              reflectedColor +=
                texture2D(tDiffuse, hitUv - vec2(blurOffset.x, 0.0)).rgb * 0.125;
              reflectedColor +=
                texture2D(tDiffuse, hitUv + vec2(0.0, blurOffset.y)).rgb * 0.125;
              reflectedColor +=
                texture2D(tDiffuse, hitUv - vec2(0.0, blurOffset.y)).rgb * 0.125;

              float facing = clamp(
                dot(-viewDirection, surfaceNormal),
                0.0,
                1.0
              );
              float fresnel = pow(1.0 - facing, 5.0);
              float edgeDistance = min(
                min(hitUv.x, 1.0 - hitUv.x),
                min(hitUv.y, 1.0 - hitUv.y)
              );
              float surfaceEdgeDistance = min(
                min(vUv.x, 1.0 - vUv.x),
                min(vUv.y, 1.0 - vUv.y)
              );
              float edgeFade =
                smoothstep(0.0, 0.085, edgeDistance) *
                smoothstep(0.0, 0.065, surfaceEdgeDistance);
              float reflectionStrength =
                mix(0.18, 0.9, fresnel) *
                (1.0 - roughness) *
                edgeFade *
                mix(1.0, 0.42, fallbackReflection);

              gl_FragColor = vec4(reflectedColor, reflectionStrength);
            }
          `
        };

        const lightweightSSRCompositeShader = {
          uniforms: {
            tDiffuse: { value: null },
            tSSR: { value: null }
          },
          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform sampler2D tSSR;
            varying vec2 vUv;

            void main() {
              vec4 sceneColor = texture2D(tDiffuse, vUv);
              vec4 reflection = texture2D(tSSR, vUv);
              gl_FragColor = vec4(
                mix(sceneColor.rgb, reflection.rgb, reflection.a),
                sceneColor.a
              );
            }
          `
        };

        class LightweightSSRShaderPass extends THREE.ShaderPass {
          constructor(sceneToRender, cameraToUse, normalTexture, depthTexture) {

            this.cameraToUse = cameraToUse;
            this.normalTexture = normalTexture;
            this.depthTexture = depthTexture;

              minFilter: THREE.LinearFilter,
              magFilter: THREE.LinearFilter,
              format: THREE.RGBAFormat,
              type: THREE.UnsignedByteType,
              depthBuffer: true,
              stencilBuffer: false
            };
            this.reflectiveMaskTarget = new THREE.WebGLRenderTarget(
              Math.max(1, Math.floor(window.innerWidth * 0.5)),
              Math.max(1, Math.floor(window.innerHeight * 0.5)),
              targetOptions
            );

            this.reflectiveMaskTarget.depthTexture = new THREE.DepthTexture();
            this.reflectiveMaskTarget.depthTexture.type =

              Math.max(1, Math.floor(window.innerWidth * 0.5)),
              Math.max(1, Math.floor(window.innerHeight * 0.5)),

                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                type: THREE.UnsignedByteType,
                depthBuffer: false,
                stencilBuffer: false
              }
            );

            this.reflectiveMaskMaterial = new THREE.ShaderMaterial({
              uniforms: {
                roughness: { value: 0.05 }

              vertexShader: `
                void main() {
                  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

              `,
              fragmentShader: `
                uniform float roughness;

                void main() {
                  gl_FragColor = vec4(1.0, roughness, 0.0, 1.0);

              depthTest: true,
              depthWrite: true,
              side: THREE.DoubleSide

              uniforms: THREE.UniformsUtils.clone(
                lightweightSSRRaymarchShader.uniforms

              vertexShader: lightweightSSRRaymarchShader.vertexShader,
              fragmentShader: lightweightSSRRaymarchShader.fragmentShader,
              depthTest: false,
              depthWrite: false

            this.raymarchMaterial.uniforms.tNormal.value = normalTexture;
            this.raymarchMaterial.uniforms.tDepth.value = depthTexture;

            this.raymarchMaterial.uniforms.tReflectiveDepth.value =

              cameraToUse.near;
            this.raymarchMaterial.uniforms.cameraFar.value =
              cameraToUse.far;

              cameraToUse.projectionMatrix

            this.raymarchMaterial.uniforms.cameraProjectionMatrixInverse.value.copy(
              cameraToUse.projectionMatrixInverse

              this.raymarchMaterial

            this.uniforms.tSSR.value = this.reflectionTarget.texture;

            const halfWidth = Math.max(1, Math.floor(width * 0.5));
            const halfHeight = Math.max(1, Math.floor(height * 0.5));

            this.reflectionTarget.setSize(halfWidth, halfHeight);

              1 / Math.max(1, height)

            const previousOverrideMaterial = this.sceneToRender.overrideMaterial;
            const previousBackground = this.sceneToRender.background;

            const previousClearColor = new THREE.Color();
            rendererToUse.getClearColor(previousClearColor);

            this.sceneToRender.overrideMaterial = this.reflectiveMaskMaterial;
            this.sceneToRender.background = null;
            this.cameraToUse.layers.set(SSR_REFLECTIVE_LAYER);

            rendererToUse.setClearColor(0x000000, 0);
            rendererToUse.setRenderTarget(this.reflectiveMaskTarget);
            rendererToUse.clear(true, true, true);
            rendererToUse.render(this.sceneToRender, this.cameraToUse);

            this.sceneToRender.overrideMaterial = previousOverrideMaterial;
            this.sceneToRender.background = previousBackground;
            this.cameraToUse.layers.mask = previousCameraLayerMask;
            rendererToUse.setClearColor(previousClearColor, previousClearAlpha);

            this.raymarchMaterial.uniforms.tDiffuse.value = readBuffer.texture;
            this.raymarchMaterial.uniforms.cameraProjectionMatrix.value.copy(
              this.cameraToUse.projectionMatrix
            );
            this.raymarchMaterial.uniforms.cameraProjectionMatrixInverse.value.copy(
              this.cameraToUse.projectionMatrixInverse
            );
            rendererToUse.setRenderTarget(this.reflectionTarget);
            rendererToUse.clear(true, false, false);
            this.raymarchQuad.render(rendererToUse);

            rendererToUse.autoClear = previousAutoClear;
            rendererToUse.setRenderTarget(previousRenderTarget);
            super.render(rendererToUse, writeBuffer, readBuffer);
          }

          dispose() {
            this.reflectiveMaskTarget.dispose();
            this.reflectionTarget.dispose();
            this.reflectiveMaskMaterial.dispose();
            this.raymarchMaterial.dispose();
            this.raymarchQuad.dispose();
          }
        }

        const ssrPass = new LightweightSSRShaderPass(
          scene,
          camera,
          ssaoPass.normalRenderTarget.texture,
          ssaoPass.beautyRenderTarget.depthTexture
        );

        function markSSRReflectiveObject(object, roughness) {
          object.userData.isReflective = true;
          object.userData.ssrRoughness = roughness;
          object.layers.enable(SSR_REFLECTIVE_LAYER);
          object.onBeforeRender = (
            rendererToUse,
            sceneToRender,
            cameraToUse,
            geometry,
            material
          ) => {
            if (material !== ssrPass.reflectiveMaskMaterial) return;
            material.uniforms.roughness.value =
              object.userData.ssrRoughness;
            material.uniformsNeedUpdate = true;
          };
        }

        const bloomPass = new THREE.UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          0.5,
          0.7,
          0.8
        );
        const setBloomNativeSize = bloomPass.setSize.bind(bloomPass);
        bloomPass.setSize = (width, height) => {
          // UnrealBloomPass halves the supplied dimensions internally, so a
          // half-size input produces a true quarter-resolution bright target.
          setBloomNativeSize(
            Math.max(1, Math.floor(width * 0.5)),
            Math.max(1, Math.floor(height * 0.5))
          );
        };
        const colorGradingShader = {
          uniforms: {
            tDiffuse: { value: null },
            time: { value: 0 },
            grainAmplitude: { value: 0.03 }
          },
          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float time;
            uniform float grainAmplitude;
            varying vec2 vUv;

            float randomNoise(vec2 coordinate) {
              return fract(
                sin(dot(coordinate, vec2(12.9898, 78.233)) + time * 41.37) *
                43758.5453
              );
            }

            void main() {
              vec4 sceneColor = texture2D(tDiffuse, vUv);
              vec3 graded = (sceneColor.rgb - 0.5) * 1.08 + 0.5;
              float luminance = dot(
                graded,
                vec3(0.2126, 0.7152, 0.0722)
              );
              graded = mix(vec3(luminance), graded, 0.88);

              float shadowAmount = 1.0 - smoothstep(0.12, 0.5, luminance);
              float highlightAmount = smoothstep(0.58, 1.0, luminance);
              vec3 coolShadow = vec3(0.039216, 0.062745, 0.125490);
              vec3 warmHighlight = vec3(1.0, 0.972549, 0.941176);
              graded = mix(graded, coolShadow, shadowAmount * 0.08);
              graded = mix(graded, warmHighlight, highlightAmount * 0.06);

              float grain =
                (randomNoise(vUv) - 0.5) * 2.0 * grainAmplitude;
              gl_FragColor = vec4(graded + grain, sceneColor.a);
            }
          `
        };
        const colorGradingPass = new THREE.ShaderPass(colorGradingShader);

        // Read nine evenly spaced samples with one tiny GPU readback. The
        // center sample carries extra weight so a bright lamp or fire in the
        // player's gaze affects adaptation sooner than peripheral highlights.
        class EyeAdaptationPass extends THREE.Pass {
          constructor(rendererToAdapt) {
            super();

            this.needsSwap = false;
            this.averageLuminance = 0.18;
            this.targetExposure = rendererToAdapt.toneMappingExposure;
            this.currentExposure = rendererToAdapt.toneMappingExposure;
            this.samplePixels = new Uint8Array(3 * 3 * 4);
            this.sampleWeights = [1, 1.5, 1, 1.5, 3, 1.5, 1, 1.5, 1];
            this.sampleTarget = new THREE.WebGLRenderTarget(3, 3, {
              minFilter: THREE.LinearFilter,
              magFilter: THREE.LinearFilter,
              format: THREE.RGBAFormat,
              type: THREE.UnsignedByteType,
              depthBuffer: false,
              stencilBuffer: false
            });
            this.sampleTarget.texture.name = 'EyeAdaptation.3x3Luminance';
            this.sampleMaterial = new THREE.ShaderMaterial({
              uniforms: { tDiffuse: { value: null } },
              vertexShader: `
                varying vec2 vUv;

                void main() {
                  vUv = uv;
                  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
              `,
              fragmentShader: `
                uniform sampler2D tDiffuse;
                varying vec2 vUv;

                void main() {
                  gl_FragColor = texture2D(tDiffuse, vUv);
                }
              `,
              depthTest: false,
              depthWrite: false
            });
            this.sampleQuad = new THREE.FullScreenQuad(
              this.sampleMaterial
            );
          }

          render(rendererToUse, writeBuffer, readBuffer) {
            const previousTarget = rendererToUse.getRenderTarget();
            const previousAutoClear = rendererToUse.autoClear;
            this.sampleMaterial.uniforms.tDiffuse.value = readBuffer.texture;
            rendererToUse.autoClear = true;
            rendererToUse.setRenderTarget(this.sampleTarget);
            rendererToUse.clear();
            this.sampleQuad.render(rendererToUse);
            rendererToUse.readRenderTargetPixels(
              this.sampleTarget,
              0,
              0,
              3,
              3,
              this.samplePixels
            );
            rendererToUse.setRenderTarget(previousTarget);
            rendererToUse.autoClear = previousAutoClear;

            let weightedLuminance = 0;
            let totalWeight = 0;
            for (let i = 0; i < 9; i += 1) {
              const offset = i * 4;
              const red = this.samplePixels[offset] / 255;
              const green = this.samplePixels[offset + 1] / 255;
              const blue = this.samplePixels[offset + 2] / 255;
              const luminance =
                red * 0.2126 + green * 0.7152 + blue * 0.0722;
              const weight = this.sampleWeights[i];
              weightedLuminance += luminance * weight;
              totalWeight += weight;
            }
            this.averageLuminance = weightedLuminance / totalWeight;

            const brightness = THREE.MathUtils.smoothstep(
              this.averageLuminance,
              0.1,
              0.58
            );
            this.targetExposure = THREE.MathUtils.lerp(1.1, 0.6, brightness);
            this.currentExposure +=
              (this.targetExposure - this.currentExposure) * 0.02;
            this.rendererToAdapt.toneMappingExposure = this.currentExposure;
          }

          dispose() {
            this.sampleTarget.dispose();
            this.sampleMaterial.dispose();
            this.sampleQuad.dispose();
          }
        }

        const depthOfFieldShader = {
          uniforms: {
            tDiffuse: { value: null },
            tDepth: { value: ssaoPass.beautyRenderTarget.depthTexture },
            resolution: {
              value: new THREE.Vector2(
                window.innerWidth * renderer.getPixelRatio(),
                window.innerHeight * renderer.getPixelRatio()
              )
            },
            cameraNear: { value: camera.near },
            cameraFar: { value: camera.far },
            focusDistance: { value: 4 },
            farBlurStart: { value: 12 },
            maxBlurPixels: { value: 2.5 },
            stargazing: { value: 0 }
          },
          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform sampler2D tDepth;
            uniform vec2 resolution;
            uniform float cameraNear;
            uniform float cameraFar;
            uniform float focusDistance;
            uniform float farBlurStart;
            uniform float maxBlurPixels;
            uniform float stargazing;
            varying vec2 vUv;

            float viewDistanceFromDepth(float depth) {
              float viewZ =
                (cameraNear * cameraFar) /
                ((cameraFar - cameraNear) * depth - cameraFar);
              return -viewZ;
            }

            void main() {
              vec4 centerColor = texture2D(tDiffuse, vUv);
              float viewDistance = viewDistanceFromDepth(
                texture2D(tDepth, vUv).x
              );
              float farGate = smoothstep(
                farBlurStart,
                farBlurStart + 34.0,
                viewDistance
              );
              float focusSeparation = clamp(
                (viewDistance - focusDistance) /
                  max(0.001, farBlurStart - focusDistance),
                0.0,
                1.0
              );
              float farBlur =
                maxBlurPixels * farGate * focusSeparation;
              float infinityNearBlur =
                (1.0 - smoothstep(0.7, focusDistance, viewDistance)) * 0.35;
              float blurPixels = mix(
                farBlur,
                infinityNearBlur,
                stargazing
              );

              vec2 texel = blurPixels / resolution;
              vec3 blurred = centerColor.rgb * 0.2;
              blurred += texture2D(tDiffuse, vUv + vec2(texel.x, 0.0)).rgb * 0.1;
              blurred += texture2D(tDiffuse, vUv - vec2(texel.x, 0.0)).rgb * 0.1;
              blurred += texture2D(tDiffuse, vUv + vec2(0.0, texel.y)).rgb * 0.1;
              blurred += texture2D(tDiffuse, vUv - vec2(0.0, texel.y)).rgb * 0.1;
              blurred += texture2D(tDiffuse, vUv + texel).rgb * 0.1;
              blurred += texture2D(tDiffuse, vUv - texel).rgb * 0.1;
              blurred += texture2D(tDiffuse, vUv + vec2(texel.x, -texel.y)).rgb * 0.1;
              blurred += texture2D(tDiffuse, vUv + vec2(-texel.x, texel.y)).rgb * 0.1;
              gl_FragColor = vec4(blurred, centerColor.a);
            }
          `
        };
        const depthOfFieldPass = new THREE.ShaderPass(depthOfFieldShader);

        const chromaticAberrationShader = {
          uniforms: {
            tDiffuse: { value: null },
            resolution: {
              value: new THREE.Vector2(
                window.innerWidth * renderer.getPixelRatio(),
                window.innerHeight * renderer.getPixelRatio()

            edgeSplitPixels: { value: 0.5 }

          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }

          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform vec2 resolution;
            uniform float edgeSplitPixels;
            varying vec2 vUv;

            void main() {
              vec2 fromCenter = vUv - 0.5;
              float edgeAmount = smoothstep(
                0.28,
                0.7,
                length(fromCenter) * 1.41421356
              );
              vec2 direction = normalize(fromCenter + vec2(0.00001));
              vec2 splitOffset =
                direction * (edgeSplitPixels / resolution) * edgeAmount;
              vec4 centerColor = texture2D(tDiffuse, vUv);
              float red = texture2D(tDiffuse, vUv + splitOffset).r;
              float blue = texture2D(tDiffuse, vUv - splitOffset).b;
              gl_FragColor = vec4(red, centerColor.g, blue, centerColor.a);
            }
          `
        };
        const chromaticAberrationPass = new THREE.ShaderPass(
          chromaticAberrationShader
        );
        const eyeAdaptationPass = new EyeAdaptationPass(renderer);
        const smaaPass = new THREE.SMAAPass(
          window.innerWidth * renderer.getPixelRatio(),
          window.innerHeight * renderer.getPixelRatio()
        );
        composer.addPass(renderPass);
        composer.addPass(ssaoPass);
        composer.addPass(volumetricLightPass);
        composer.addPass(ssrPass);
        composer.addPass(bloomPass);
        composer.addPass(colorGradingPass);
        composer.addPass(depthOfFieldPass);
        composer.addPass(chromaticAberrationPass);
        composer.addPass(eyeAdaptationPass);
        composer.addPass(smaaPass);

        const breathPuff = new THREE.Mesh(
          new THREE.SphereGeometry(0.065, 8, 6),
          new THREE.MeshBasicMaterial({
            color: 0xf7fbff,
            transparent: true,
            opacity: 0,
            depthTest: false,
            depthWrite: false
          })

        breathPuff.position.set(0, -0.3, -0.72);
        breathPuff.visible = false;
        breathPuff.frustumCulled = false;
        camera.add(breathPuff);
        const windDirection = new THREE.Vector3(1, 0, -0.65).normalize();

        // A high-resolution rolling snowfield with flattened activity clearings.
        const TERRAIN_SIZE = 420;
        const TERRAIN_SEGMENTS = 200;
        const TERRAIN_BASE_Y = -0.25;
        const LAKE_CENTER_X = 23;
        const LAKE_CENTER_Z = -12;
        const terrainGeometry = new THREE.PlaneGeometry(
          TERRAIN_SIZE,
          TERRAIN_SIZE,
          TERRAIN_SEGMENTS,
          TERRAIN_SEGMENTS
        );
        terrainGeometry.rotateX(-Math.PI / 2);
        const terrainPositions = terrainGeometry.attributes.position;
        const terrainHeights = new Float32Array(terrainPositions.count);
        const terrainColors = new Float32Array(terrainPositions.count * 3);
        const terrainShade = new THREE.Color();
        const terrainValleyColor = new THREE.Color(0xb8cce0);
        const terrainPeakColor = new THREE.Color(0xf0f8ff);

        for (let i = 0; i < terrainPositions.count; i += 1) {
          const x = terrainPositions.getX(i);
          const z = terrainPositions.getZ(i);
          const centerDistance = Math.hypot(x, z);
          const cabinDistance = Math.hypot(x + 14, z + 4);
          const lakeDistance = Math.hypot(
            x - LAKE_CENTER_X,
            z - LAKE_CENTER_Z
          );
          const centerBlendRaw = Math.max(
            0,
            Math.min(1, (centerDistance - 12) / 10)
          );
          const cabinBlendRaw = Math.max(
            0,
            Math.min(1, (cabinDistance - 7.5) / 5)
          );
          const lakeBlendRaw = Math.max(
            0,
            Math.min(1, (lakeDistance - 9) / 6)
          );
          const centerBlend =
            centerBlendRaw * centerBlendRaw * (3 - 2 * centerBlendRaw);
          const cabinBlend =
            cabinBlendRaw * cabinBlendRaw * (3 - 2 * cabinBlendRaw);
          const lakeBlend =
            lakeBlendRaw * lakeBlendRaw * (3 - 2 * lakeBlendRaw);
          const primaryHills =
            Math.sin(x * 0.15) * 1.2 + Math.cos(z * 0.12) * 0.9;
          const mediumBumps =
            Math.sin(x * 0.4 + z * 0.3) * 0.35 +
            Math.cos(x * 0.3 - z * 0.5) * 0.3;
          const fineDetail =
            Math.sin(x * 1.2) * 0.06 + Math.cos(z * 1.4) * 0.05;
          const microNoise = (Math.random() - 0.5) * 0.04;
          const displacement =
            (primaryHills + mediumBumps + fineDetail + microNoise) *
            centerBlend *
            cabinBlend *
            lakeBlend;

          terrainPositions.setY(i, displacement);
          terrainHeights[i] = displacement;
        }

        // Compare each vertex to its nearest neighbors to fake soft crevice AO.
        const terrainRowWidth = TERRAIN_SEGMENTS + 1;
        for (let zIndex = 0; zIndex <= TERRAIN_SEGMENTS; zIndex += 1) {
          for (let xIndex = 0; xIndex <= TERRAIN_SEGMENTS; xIndex += 1) {
            const i = zIndex * terrainRowWidth + xIndex;
            let neighborTotal = 0;
            let neighborCount = 0;
            if (xIndex > 0) {
              neighborTotal += terrainHeights[i - 1];
              neighborCount += 1;
            }
            if (xIndex < TERRAIN_SEGMENTS) {
              neighborTotal += terrainHeights[i + 1];
              neighborCount += 1;
            }
            if (zIndex > 0) {
              neighborTotal += terrainHeights[i - terrainRowWidth];
              neighborCount += 1;
            }
            if (zIndex < TERRAIN_SEGMENTS) {
              neighborTotal += terrainHeights[i + terrainRowWidth];
              neighborCount += 1;
            }

            const neighborAverage = neighborTotal / Math.max(1, neighborCount);
            const relativeHeight = terrainHeights[i] - neighborAverage;
            const ridgeAmount = Math.max(
              0,
              Math.min(1, 0.5 + relativeHeight / 0.7)
            );
            terrainShade.lerpColors(
              terrainValleyColor,
              terrainPeakColor,
              ridgeAmount
            );
            terrainColors[i * 3] = terrainShade.r;
            terrainColors[i * 3 + 1] = terrainShade.g;
            terrainColors[i * 3 + 2] = terrainShade.b;
          }
        }

        terrainGeometry.setAttribute(
          'color',
          new THREE.BufferAttribute(terrainColors, 3)
        );
        const terrainBaseVertexColors = new Float32Array(terrainColors);
        terrainGeometry.computeVertexNormals();

        function getTerrainHeightAt(worldX, worldZ) {
          const gridMaximum = TERRAIN_SEGMENTS;
          const halfSize = TERRAIN_SIZE * 0.5;
          const gridX = Math.max(
            0,
            Math.min(
              gridMaximum,
              ((worldX + halfSize) / TERRAIN_SIZE) * gridMaximum
            )
          );
          const gridZ = Math.max(
            0,
            Math.min(
              gridMaximum,
              ((worldZ + halfSize) / TERRAIN_SIZE) * gridMaximum
            )
          );
          const x0 = Math.floor(gridX);
          const z0 = Math.floor(gridZ);
          const x1 = Math.min(gridMaximum, x0 + 1);
          const z1 = Math.min(gridMaximum, z0 + 1);
          const blendX = gridX - x0;
          const blendZ = gridZ - z0;
          const rowWidth = gridMaximum + 1;
          const height00 = terrainHeights[z0 * rowWidth + x0];
          const height10 = terrainHeights[z0 * rowWidth + x1];
          const height01 = terrainHeights[z1 * rowWidth + x0];
          const height11 = terrainHeights[z1 * rowWidth + x1];
          const heightNear = height00 + (height10 - height00) * blendX;
          const heightFar = height01 + (height11 - height01) * blendX;
          return (
            TERRAIN_BASE_Y + heightNear + (heightFar - heightNear) * blendZ
          );
        }

        const terrainMaterial = new THREE.MeshStandardMaterial({
          color: 0xddeeff,
          roughness: 0.95,
          metalness: 0,
          vertexColors: true,
          emissive: 0x110500,
          emissiveIntensity: 0
        });
        const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
        terrain.position.y = TERRAIN_BASE_Y;
        terrain.receiveShadow = true;
        scene.add(terrain);

        const SNOW_SPARKLE_COUNT = 400;
        const SNOW_SPARKLE_BUCKET_COUNT = 10;
        const snowSparkleBuckets = Array.from(
          { length: SNOW_SPARKLE_BUCKET_COUNT },
          () => []
        );
        for (let i = 0; i < SNOW_SPARKLE_COUNT; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.sqrt(Math.random()) * 62;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;
          const bucketIndex = Math.floor(
            Math.random() * SNOW_SPARKLE_BUCKET_COUNT
          );
          snowSparkleBuckets[bucketIndex].push(
            x,
            getTerrainHeightAt(x, z) + 0.035,
            z
          );
        }
        const snowSparkleLayer = new THREE.Group();
        snowSparkleLayer.name = 'SNOW_SURFACE_SPARKLES';
        const snowSparkleMaterials = [];
        for (
          let bucketIndex = 0;
          bucketIndex < SNOW_SPARKLE_BUCKET_COUNT;
          bucketIndex += 1
        ) {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute(
            'position',
            new THREE.Float32BufferAttribute(
              snowSparkleBuckets[bucketIndex],

          geometry.computeBoundingSphere();
          const material = new THREE.PointsMaterial({
            color: 0xffffff,

          });
          material.userData.randomFreq = 0.45 + Math.random() * 1.4;
          material.userData.randomOffset = Math.random() * Math.PI * 2;
          snowSparkleMaterials.push(material);
          snowSparkleLayer.add(new THREE.Points(geometry, material));
        }
        snowSparkleLayer.visible = false;
        scene.add(snowSparkleLayer);

        // Thin ripple patches add wind-sculpted detail in open snowfields.
        const snowRipplePatches = [
          { x: 12, z: 18, width: 13, depth: 8, rotation: 0.18, phase: 0.3 },
          { x: 30, z: 12, width: 12, depth: 7, rotation: -0.35, phase: 1.1 },
          { x: 39, z: -2, width: 14, depth: 8, rotation: 0.42, phase: 2.2 },
          { x: 6, z: -31, width: 13, depth: 7, rotation: -0.16, phase: 3.4 },
          { x: -34, z: 10, width: 12, depth: 8, rotation: 0.3, phase: 4.1 },
          { x: -36, z: -27, width: 14, depth: 8, rotation: -0.28, phase: 5.2 },
          { x: 0, z: 31, width: 11, depth: 7, rotation: 0.08, phase: 2.8 }
        ];
        const rippleSnowColor = new THREE.Color(0xeaf5ff);

        snowRipplePatches.forEach((patch) => {
          const rippleGeometry = new THREE.PlaneGeometry(
            patch.width,

          rippleGeometry.rotateX(-Math.PI / 2);

          const ripplePositions = rippleGeometry.attributes.position;
          const rippleColors = new Float32Array(ripplePositions.count * 3);

          for (let i = 0; i < ripplePositions.count; i += 1) {
            const localX = ripplePositions.getX(i);
            const localZ = ripplePositions.getZ(i);
            const worldX = patch.x + localX;
            const worldZ = patch.z + localZ;
            const rippleHeight =
              Math.sin(localX * 1.55 + patch.phase) * 0.025 +
              Math.cos(localZ * 2.05 - patch.phase) * 0.015;
            ripplePositions.setY(
              i,
              getTerrainHeightAt(worldX, worldZ) + 0.02 + rippleHeight
            );
            rippleColors[i * 3] = rippleSnowColor.r;
            rippleColors[i * 3 + 1] = rippleSnowColor.g;
            rippleColors[i * 3 + 2] = rippleSnowColor.b;
          }

          rippleGeometry.setAttribute(
            'color',
            new THREE.BufferAttribute(rippleColors, 3)
          );
          rippleGeometry.computeVertexNormals();
          const ripplePatch = new THREE.Mesh(rippleGeometry, terrainMaterial);
          ripplePatch.position.set(patch.x, 0, patch.z);
          ripplePatch.receiveShadow = true;
          scene.add(ripplePatch);
        });

        const groundMist = new THREE.Mesh(
          new THREE.PlaneGeometry(300, 300),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.18,
            depthWrite: false,

        groundMist.rotation.x = -Math.PI / 2;
        groundMist.position.y = 0.05;
        scene.add(groundMist);

        function smoothMountainGradient(edge0, edge1, value) {
          const amount = Math.max(
            0,
            Math.min(1, (value - edge0) / (edge1 - edge0))
          );
          return amount * amount * (3 - 2 * amount);
        }

        function createSculptedMountainGeometry(
          mountainRadius,
          mountainHeight,
          radialSegments,
          heightSegments,
          palette
        ) {
          const geometry = new THREE.ConeGeometry(
            mountainRadius,
            mountainHeight,
            radialSegments,
            heightSegments,
            false
          );
          const positions = geometry.attributes.position;
          const colors = new Float32Array(positions.count * 3);
          const bottomColor = new THREE.Color(palette.bottom);
          const middleColor = new THREE.Color(palette.middle);
          const topColor = new THREE.Color(palette.top);
          const vertexColor = new THREE.Color();

          for (let vertexIndex = 0; vertexIndex < positions.count; vertexIndex += 1) {
            const originalX = positions.getX(vertexIndex);
            const originalY = positions.getY(vertexIndex);
            const originalZ = positions.getZ(vertexIndex);
            const originalRadius = Math.hypot(originalX, originalZ);
            const radius = Math.max(originalRadius, mountainRadius * 0.02);
            const fallbackAngle =
              ((vertexIndex % radialSegments) / radialSegments) * Math.PI * 2;
            const angle =
              originalRadius > 0.0001
                ? Math.atan2(originalX, originalZ)
                : fallbackAngle;
            const height = originalY / mountainHeight;
            const largeRockyFeatures =
              Math.sin(angle * 3 + height * 2) * radius * 0.18;
            const mediumCracks =
              Math.cos(angle * 7 + height * 5) * radius * 0.08;
            const smallSurfaceDetail =
              (Math.random() - 0.5) * radius * 0.04;
            const surfaceDisplacement =
              largeRockyFeatures + mediumCracks + smallSurfaceDetail;
            const displacedRadius = Math.max(
              0.015,
              originalRadius + surfaceDisplacement
            );

            positions.setXYZ(
              vertexIndex,
              Math.sin(angle) * displacedRadius,
              originalY,
              Math.cos(angle) * displacedRadius
            );

            const heightRatio = Math.max(
              0,
              Math.min(1, originalY / mountainHeight + 0.5)
            );
            const rockBlend = smoothMountainGradient(0.22, 0.45, heightRatio);
            const snowBlend = smoothMountainGradient(0.58, 0.72, heightRatio);
            vertexColor.lerpColors(bottomColor, middleColor, rockBlend);
            vertexColor.lerp(topColor, snowBlend);
            colors[vertexIndex * 3] = vertexColor.r;
            colors[vertexIndex * 3 + 1] = vertexColor.g;
            colors[vertexIndex * 3 + 2] = vertexColor.b;
          }

          geometry.setAttribute(
            'color',
            new THREE.BufferAttribute(colors, 3)
          );
          positions.needsUpdate = true;
          geometry.computeVertexNormals();
          geometry.computeBoundingBox();
          geometry.computeBoundingSphere();
          return geometry;
        }

        function createIrregularMountainSnowCap(
          mountainRadius,
          mountainHeight,
          segmentCount,
          material
        ) {
          const snowLineHeight = mountainHeight * 0.73;
          const mountainWidthAtSnowLine =
            mountainRadius * (1 - snowLineHeight / mountainHeight) * 2;
          const capSize = mountainWidthAtSnowLine * 1.28;
          const geometry = new THREE.PlaneGeometry(
            capSize,
            capSize,
            segmentCount,
            segmentCount
          );
          geometry.rotateX(-Math.PI / 2);
          const positions = geometry.attributes.position;

          for (let vertexIndex = 0; vertexIndex < positions.count; vertexIndex += 1) {
            const x = positions.getX(vertexIndex);
            const z = positions.getZ(vertexIndex);
            const edgeDistance = Math.min(
              1,
              Math.hypot(x, z) / Math.max(0.001, capSize * 0.5)
            );
            const irregularDisplacement = (Math.random() - 0.5) * 0.8;
            const sculptedRipple =
              Math.sin(x * 1.8 + z * 0.7) * 0.11 +
              Math.cos(z * 1.45 - x * 0.55) * 0.08;
            const edgeDroop =
              smoothMountainGradient(0.55, 1, edgeDistance) * 0.42;
            positions.setY(
              vertexIndex,
              irregularDisplacement + sculptedRipple - edgeDroop
            );
          }

          geometry.computeVertexNormals();
          geometry.computeBoundingBox();
          geometry.computeBoundingSphere();
          const cap = new THREE.Mesh(geometry, material);
          cap.position.y = snowLineHeight + 0.08;
          cap.rotation.y = Math.random() * Math.PI;
          cap.castShadow = false;
          cap.receiveShadow = false;
          return cap;
        }

        const mountainMaterial = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          vertexColors: true,
          roughness: 0.9,
          metalness: 0.05
        });
        const snowCapMaterial = new THREE.MeshStandardMaterial({

        });
        const distantMountainMaterial = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          vertexColors: true,

        });
        const distantSnowCapMaterial = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.92,
          metalness: 0,
          transparent: true,
          opacity: 0.5,
          depthWrite: false,

        });
        const nearMountainPalette = {
          bottom: 0x4a4540,
          middle: 0x8a9aaa,

        };
        const distantMountainPalette = {
          bottom: 0x53616d,
          middle: 0x7a8a9a,
          top: 0xa9b8c6
        };

        // A faint outer range rises beyond the collidable mountain boundary.
        const distantMountainRing = new THREE.Group();
        const DISTANT_MOUNTAIN_COUNT = 9;
        const mountainSnowCapGeometries = [];

        for (let i = 0; i < DISTANT_MOUNTAIN_COUNT; i += 1) {
          const angle =
            (i / DISTANT_MOUNTAIN_COUNT) * Math.PI * 2 +
            (Math.random() - 0.5) * 0.18;
          const ringRadius = 100 + Math.random() * 50;
          const mountainHeight = 50 + Math.random() * 30;
          const mountainRadius = 20 + Math.random() * 15;
          const distantMountain = new THREE.Mesh(
            createSculptedMountainGeometry(
              mountainRadius,

            ),
