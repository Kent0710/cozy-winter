          );
          distantMountain.position.set(
            Math.cos(angle) * ringRadius,
            0,
            Math.sin(angle) * ringRadius
          );
          distantMountain.position.y =
            getTerrainHeightAt(
              distantMountain.position.x,
              distantMountain.position.z
            ) +
            mountainHeight * 0.5;
          distantMountain.rotation.y = Math.random() * Math.PI * 2;
          distantMountain.castShadow = false;
          distantMountain.receiveShadow = false;
          distantMountain.frustumCulled = true;
          distantMountainRing.add(distantMountain);

          const distantSnowCap = createIrregularMountainSnowCap(
            mountainRadius,
            mountainHeight,
            8,
            distantSnowCapMaterial
          );
          distantSnowCap.position.x = distantMountain.position.x;
          distantSnowCap.position.z = distantMountain.position.z;
          distantSnowCap.position.y +=
            distantMountain.position.y - mountainHeight * 0.5;
          distantSnowCap.frustumCulled = true;
          distantSnowCap.updateMatrix();
          mountainSnowCapGeometries.push(
            distantSnowCap.geometry.clone().applyMatrix4(
              distantSnowCap.matrix
            )
          );
        }
        scene.add(distantMountainRing);

        // A ring of sculpted, snow-capped peaks forms the visible world edge.
        const mountainRing = new THREE.Group();
        const MOUNTAIN_COUNT = 16;
        const MOUNTAIN_COLLISION_BUFFER = 1.5;
        const WORLD_BOUNDARY_RADIUS = 72;
        const COLLISION_PROXIMITY = 15;
        const PLAYER_COLLISION_RADIUS = 0.4;
        const collidables = [];
        const nearbyCollidables = [];
        const mountainFootprints = [];
        const mountainLodControllers = [];
        const dynamicOutdoorShadowCasters = [];

        function registerDynamicOutdoorShadowCaster(
          object,
          x,
          z,
          maximumDistance = Infinity
        ) {
          const meshes = [];
          object.traverse((child) => {
            if (!child.isMesh) return;
            child.castShadow = false;
            child.receiveShadow = true;
            meshes.push(child);
          });
          dynamicOutdoorShadowCasters.push({
            x,
            z,
            maximumDistance,
            meshes,
            enabled: false
          });
        }

        for (let i = 0; i < MOUNTAIN_COUNT; i += 1) {
          const angle =
            (i / MOUNTAIN_COUNT) * Math.PI * 2 +
            (Math.random() - 0.5) * 0.11;
          const ringRadius = 60 + Math.random() * 20;
          const mountainHeight = 20 + Math.random() * 25;
          const mountainRadius = 8 + Math.random() * 10;
          const offsetX = (Math.random() - 0.5) * 10;
          const offsetZ = (Math.random() - 0.5) * 10;
          const peak = new THREE.Group();

          peak.position.set(
            Math.cos(angle) * ringRadius + offsetX,
            -0.25,
            Math.sin(angle) * ringRadius + offsetZ
          );
          const peakDistanceFromCenter = Math.hypot(
            peak.position.x,
            peak.position.z
          );
          const maximumReachableCenterDistance =
            WORLD_BOUNDARY_RADIUS - 0.75 +
            mountainRadius +
            MOUNTAIN_COLLISION_BUFFER;
          if (peakDistanceFromCenter > maximumReachableCenterDistance) {
            const reachableScale =
              maximumReachableCenterDistance / peakDistanceFromCenter;
            peak.position.x *= reachableScale;
            peak.position.z *= reachableScale;
          }
          peak.position.y = getTerrainHeightAt(
            peak.position.x,
            peak.position.z
          );
          peak.rotation.y = Math.random() * Math.PI * 2;

          const mountain = new THREE.Mesh(
            createSculptedMountainGeometry(
              mountainRadius,
              mountainHeight,
              32,
              24,
              nearMountainPalette
            ),
            mountainMaterial
          );
          mountain.position.y = mountainHeight * 0.5;
          mountain.castShadow = false;
          mountain.receiveShadow = true;
          const simplifiedMountain = new THREE.Mesh(
            createSculptedMountainGeometry(
              mountainRadius,
              mountainHeight,
              12,
              8,
              nearMountainPalette
            ),
            mountainMaterial
          );
          simplifiedMountain.position.y = mountainHeight * 0.5;
          simplifiedMountain.castShadow = false;
          simplifiedMountain.receiveShadow = true;
          const mountainLOD = new THREE.LOD();
          mountainLOD.autoUpdate = false;
          mountainLOD.addLevel(mountain, 0);
          mountainLOD.addLevel(simplifiedMountain, 50);
          mountainLodControllers.push(mountainLOD);
          peak.add(mountainLOD);

          const snowCap = createIrregularMountainSnowCap(
            mountainRadius,
            mountainHeight,
            12,
            snowCapMaterial
          );
          snowCap.castShadow = false;
          snowCap.receiveShadow = true;
          peak.updateMatrix();
          snowCap.updateMatrix();
          const snowCapWorldMatrix = new THREE.Matrix4().multiplyMatrices(
            peak.matrix,
            snowCap.matrix
          );
          mountainSnowCapGeometries.push(
            snowCap.geometry.clone().applyMatrix4(snowCapWorldMatrix)
          );

          mountainFootprints.push({
            x: peak.position.x,
            y: peak.position.y,
            z: peak.position.z,
            radius: mountainRadius,
            height: mountainHeight
          });
          collidables.push({
            type: 'circle',
            x: peak.position.x,
            z: peak.position.z,
            radius: mountainRadius + MOUNTAIN_COLLISION_BUFFER
          });
          registerDynamicOutdoorShadowCaster(
            peak,
            peak.position.x,
            peak.position.z,
            40
          );
          mountainRing.add(peak);
        }
        scene.add(mountainRing);

        const mergedMountainSnowCaps = new THREE.Mesh(
          THREE.BufferGeometryUtils.mergeBufferGeometries(
            mountainSnowCapGeometries,
            false
          ),
          snowCapMaterial
        );
        mergedMountainSnowCaps.name = 'MERGED_MOUNTAIN_SNOW_CAPS';
        mergedMountainSnowCaps.castShadow = false;
        mergedMountainSnowCaps.receiveShadow = true;
        scene.add(mergedMountainSnowCaps);

        function updateMountainLOD() {
          for (let i = 0; i < mountainLodControllers.length; i += 1) {
            const footprint = mountainFootprints[i];
            const useFullDetail =
              Math.hypot(
                camera.position.x - footprint.x,
                camera.position.z - footprint.z
              ) < 50;
            const levels = mountainLodControllers[i].levels;
            levels[0].object.visible = useFullDetail;
            levels[1].object.visible = !useFullDetail;
          }
        }

        // Cool, low-intensity moonlight
        const ambientLight = new THREE.HemisphereLight(
          0x1a2a4a,
          0x0a0a10,
          0.4
        );
        scene.add(ambientLight);

        // Cold light reflected upward by the broad, high-albedo snowfield.
        const snowBounceLight = new THREE.HemisphereLight(
          0xc8d8ff,
          0xddeeff,
          0.6
        );
        snowBounceLight.name = 'SNOW_BOUNCE_GI';
        scene.add(snowBounceLight);

        const auroraBounceLight = new THREE.HemisphereLight(
          0x00ffaa,
          0x080812,
          0
        );
        auroraBounceLight.name = 'AURORA_SKY_BOUNCE';
        scene.add(auroraBounceLight);
        const auroraGreenLightColor = new THREE.Color(0x00ffaa);
        const auroraPurpleLightColor = new THREE.Color(0xaa00ff);
        const auroraSoftGreenLightColor = new THREE.Color(0x8dffc7);
        const auroraDominantLightColor = new THREE.Color();

        function updateAuroraLightContribution(elapsed) {
          const colorShift = smoothStep(
            Math.sin(elapsed * 0.115) * 0.5 + 0.5
          );
          auroraDominantLightColor.lerpColors(
            auroraGreenLightColor,
            auroraPurpleLightColor,
            colorShift
          );
          const softGreenPulse =
            Math.sin(elapsed * 0.071 + 1.7) * 0.5 + 0.5;
          auroraDominantLightColor.lerp(
            auroraSoftGreenLightColor,
            softGreenPulse * 0.18
          );
          auroraBounceLight.color.copy(auroraDominantLightColor);
          auroraBounceLight.intensity =
            0.15 *
            celestialVisibility *
            (0.86 + Math.sin(elapsed * 0.19) * 0.14) *
            (1 - interiorLightingBlend * 0.88);
        }

        // Two coordinated directional lights approximate cascaded moon

        const moonShadowTarget = new THREE.Object3D();
        scene.add(moonShadowTarget);
        const moonLight = new THREE.DirectionalLight(0xc8d8ff, 0.2);

        moonLight.shadow.camera.right = 18;

        moonLight.shadow.camera.bottom = -18;

        const moonFarLight = new THREE.DirectionalLight(0xc8d8ff, 0.1);
        moonFarLight.position.copy(moonLight.position);

        const moonCascadeOffset = new THREE.Vector3(-35, 70, 25);
        function updateMoonCascadeShadows() {
          moonShadowTarget.position.set(

        // Hollow cabin shell, turned so its open doorway faces the campfire.

        const cabinOuterWidth = CABIN_WIDTH + CABIN_WALL_THICKNESS * 2;

        addCabinWallPanel(

        );
        addCabinWallPanel(
          CABIN_WALL_THICKNESS,
          CABIN_HEIGHT,
          CABIN_DEPTH,
          CABIN_WIDTH * 0.5 + CABIN_WALL_THICKNESS * 0.5,
          wallCenterY,
          0,
          rightWallFaces
        );
        addCabinWallPanel(
          CABIN_WALL_THICKNESS,
          CABIN_HEIGHT,
          CABIN_DEPTH,
          -CABIN_WIDTH * 0.5 - CABIN_WALL_THICKNESS * 0.5,
          wallCenterY,
          0,
          leftWallFaces
        );

        const frontSegmentWidth =
          (cabinOuterWidth - CABIN_DOOR_WIDTH) * 0.5;
        const frontSegmentOffset =
          CABIN_DOOR_WIDTH * 0.5 + frontSegmentWidth * 0.5;
        const frontWallZ =
          CABIN_DEPTH * 0.5 + CABIN_WALL_THICKNESS * 0.5;
        addCabinWallPanel(

          CABIN_HEIGHT,

          wallCenterY,
          frontWallZ,

        addCabinWallPanel(
          frontSegmentWidth,
          CABIN_HEIGHT,
          CABIN_WALL_THICKNESS,
          frontSegmentOffset,
          wallCenterY,
          frontWallZ,
          frontWallFaces
        );
        addCabinWallPanel(
          CABIN_DOOR_WIDTH,
          CABIN_HEIGHT - CABIN_DOOR_HEIGHT,
          CABIN_WALL_THICKNESS,
          0,
          CABIN_DOOR_HEIGHT +
            (CABIN_HEIGHT - CABIN_DOOR_HEIGHT) * 0.5,
          frontWallZ,
          frontWallFaces,
          false
        );

        const cabinFloorMaterial = new THREE.MeshStandardMaterial({
          color: 0x4a2e1a,
          roughness: 0.75,
          metalness: 0,
          side: THREE.DoubleSide,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1
        });
        const cabinFloor = new THREE.Mesh(
          new THREE.PlaneGeometry(CABIN_WIDTH, CABIN_DEPTH),

        );
        cabinFloor.rotation.x = -Math.PI / 2;
        cabinFloor.position.y = 0;
        cabinFloor.receiveShadow = true;
        cabinInterior.add(cabinFloor);

        const cabinCeiling = new THREE.Mesh(
          new THREE.PlaneGeometry(CABIN_WIDTH, CABIN_DEPTH),
          cabinFloorMaterial

        cabinCeiling.rotation.x = Math.PI / 2;
        cabinCeiling.position.y = CABIN_HEIGHT;
        cabinCeiling.receiveShadow = false;
        cabinInterior.add(cabinCeiling);

        const interiorFlickerLights = [];

        function registerInteriorFlickerLight(light, baseIntensity) {
          light.userData.baseIntensity = baseIntensity;
          light.userData.flickerSpeed = 1.5 + Math.random() * 2.2;
          light.userData.flickerOffset = Math.random() * Math.PI * 2;
          interiorFlickerLights.push(light);
        }

        const oilLamp = new THREE.Group();
        oilLamp.position.set(0, CABIN_HEIGHT, 0);
        cabinInterior.add(oilLamp);

        const lampChain = new THREE.Mesh(

        lampChain.position.y = -0.2;
        oilLamp.add(lampChain);

        const lampBody = new THREE.Mesh(
          new THREE.SphereGeometry(0.2, 8, 6),

          })

        lampBody.position.y = -0.4;
        lampBody.scale.set(1, 0.82, 1);
        oilLamp.add(lampBody);

        const interiorPointLight = new THREE.PointLight(

        interiorPointLight.position.y = -0.4;
        interiorPointLight.castShadow = false;
        interiorPointLight.shadow.mapSize.set(1024, 1024);
        interiorPointLight.shadow.camera.near = 0.1;
        interiorPointLight.shadow.camera.far = 10;
        interiorPointLight.shadow.bias = -0.004;
        interiorPointLight.shadow.radius = 3;
        oilLamp.add(interiorPointLight);
        registerInteriorFlickerLight(interiorPointLight, 6);

        THREE.RectAreaLightUniformsLib.init();
        const interiorWallBounceLights = [];

        function addInteriorWallBounceLight(x, y, z, width, height) {

            0x4a2e1a,

            height
          );

          bounceLight.lookAt(0, 1.35, 0);
          bounceLight.userData.baseIntensity = 0.4;
          bounceLight.userData.isIndirectBounce = true;
          bounceLight.name = 'INTERIOR_WALL_BOUNCE';
          interiorWallBounceLights.push(bounceLight);
          cabinInterior.add(bounceLight);
        }

        addInteriorWallBounceLight(0, 1.55, -4.78, 7.6, 2.6);
        addInteriorWallBounceLight(0, 1.55, 4.78, 7.6, 2.6);
        addInteriorWallBounceLight(-4.78, 1.55, 0, 7.6, 2.6);
        addInteriorWallBounceLight(4.78, 1.55, 0, 7.6, 2.6);

        let isInsideCabin = false;
        let interiorLightingBlend = 0;
        let campfireInteriorMultiplier = 1;

        const frameDepth = CABIN_WALL_THICKNESS + 0.12;
        const frameWidth = 0.16;
        [-1, 1].forEach((side) => {
          const framePost = new THREE.Mesh(
            new THREE.BoxGeometry(frameWidth, CABIN_DOOR_HEIGHT, frameDepth),
            cabinFrameMaterial
          );
          framePost.position.set(

          );
          framePost.castShadow = true;
          framePost.receiveShadow = true;
          cabinShellShadowMeshes.push(framePost);
          cabin.add(framePost);
        });
        const frameHeader = new THREE.Mesh(
          new THREE.BoxGeometry(

          ),

        frameHeader.position.set(

          CABIN_DOOR_HEIGHT + frameWidth * 0.5,

        );
        frameHeader.castShadow = true;
        frameHeader.receiveShadow = true;
        cabinShellShadowMeshes.push(frameHeader);
        cabin.add(frameHeader);

        // Simple bed tucked into the back-left corner.

        function addBedPart(geometry, material, position) {

        addBedPart(

          new THREE.Vector3(0, 0.67, -2.16)
        );

        // Tall bookshelf and tightly packed books in the back-right corner.

        const bookshelfBack = new THREE.Mesh(

        bookshelfBack.position.y = 1.25;

        [-1.14, 1.14].forEach((x) => {

          );
          sidePanel.position.set(x, 1.25, 0.32);
          sidePanel.castShadow = true;
          sidePanel.receiveShadow = true;

        const bookColors = [
          0x8b2020,

        ];
        const shelfHeights = [0.35, 1.1, 1.85];

        shelfHeights.forEach((shelfY) => {
          const shelf = new THREE.Mesh(

          shelf.castShadow = true;
          shelf.receiveShadow = true;

          const bookCount = 8 + Math.floor(Math.random() * 5);
          let bookCursor = -1.02;

            );
            book.position.set(

        const bookshelfTop = new THREE.Mesh(
          new THREE.BoxGeometry(2.35, 0.12, 0.72),

        bookshelfTop.position.set(0, 2.5, 0.32);
        bookshelfTop.castShadow = true;
        bookshelfTop.receiveShadow = true;
        bookshelf.add(bookshelfTop);

        const candle = new THREE.Mesh(

            0.2,
            innerColor.replace('ALPHA', opacity * 0.72)
          );
          gradient.addColorStop(
            0.58,
            outerColor.replace('ALPHA', opacity * 0.24)
          );
          gradient.addColorStop(1, outerColor.replace('ALPHA', 0));
          context.fillStyle = gradient;
          context.fillRect(0, 0, 128, 128);
          const texture = new THREE.CanvasTexture(canvas);
          texture.encoding = THREE.sRGBEncoding;
          return texture;
        }

        const campfireFlareTexture = createLensflareTexture(

        const lensflareCameraPosition = new THREE.Vector3();
        const lensflareCameraDirection = new THREE.Vector3();
        const lensflareSourcePosition = new THREE.Vector3();
        const lensflareSourceDirection = new THREE.Vector3();
        const lensflareProjectedPosition = new THREE.Vector3();

        function sourceIsInCameraView(source, minimumFacing) {
          camera.getWorldPosition(lensflareCameraPosition);
          camera.getWorldDirection(lensflareCameraDirection);
          source.getWorldPosition(lensflareSourcePosition);
          lensflareSourceDirection
            .subVectors(lensflareSourcePosition, lensflareCameraPosition)
            .normalize();
          if (
            lensflareCameraDirection.dot(lensflareSourceDirection) <
            minimumFacing
          ) {
            return false;
          }
          lensflareProjectedPosition
            .copy(lensflareSourcePosition)
            .project(camera);
          return (
            lensflareProjectedPosition.z > -1 &&
            lensflareProjectedPosition.z < 1 &&
            Math.abs(lensflareProjectedPosition.x) < 1.05 &&
            Math.abs(lensflareProjectedPosition.y) < 1.05
          );
        }

        function updateLensflareVisibility(fireFlickerFactor) {
          const fireFacesCamera = sourceIsInCameraView(fireLight, 0.46);
          campfireLensflare.visible =
            !isInsideCabin &&

        const fireTexture = new THREE.CanvasTexture(fireCanvas);

        const fireParticleMesh = new THREE.InstancedMesh(

            map: fireTexture,

        const fireParticleScale = new THREE.Vector3();

        function placeFireParticle(particle) {
          const data = particle.userData;
          const progress = data.age / data.life;
          fireParticlePosition.set(
            data.startX + data.driftX * data.age +
              Math.sin(data.phase + data.age * 7) * 0.13,
            0.72 + data.riseSpeed * data.age,
            data.startZ + data.driftZ * data.age
          );
          fireParticleColor.lerpColors(
            fireOrange,
            fireRed,
            Math.min(progress / 0.62, 1)
          );
          const fade =
            Math.min(1, data.age * 12) * Math.pow(1 - progress, 1.45) * 0.92;

          const size =
            data.size * (1 - progress * 0.52) * Math.sqrt(fade);
          fireParticleScale.set(
            Math.max(0.001, size * 0.72),
            Math.max(0.001, size * 1.45),
            1

          fireParticleMatrix.compose(
            fireParticlePosition,
            camera.quaternion,
            fireParticleScale

          fireParticleMesh.setMatrixAt(
            particle.instanceIndex,
            fireParticleMatrix

          fireParticleMesh.setColorAt(
            particle.instanceIndex,

        function resetFireParticle(particle, initialPlacement) {

          placeFireParticle(particle);

        // Frozen lake, separated from the fire on the cabin's far-right side.

        const LAKE_RADIUS = 11.5;
        const ICE_ANGULAR_SEGMENTS = 64;
        const ICE_RADIAL_SUBDIVISIONS = 80;

        function createSubdividedCircleGeometry(
          radius,
          angularSegments,
          radialSubdivisions
        ) {
          const geometry = new THREE.CircleGeometry(radius, angularSegments);
          const ringStride = angularSegments + 1;
          const vertexCount = 1 + radialSubdivisions * ringStride;
          const positions = new Float32Array(vertexCount * 3);
          const uvs = new Float32Array(vertexCount * 2);
          const indices = [];
          uvs[0] = 0.5;
          uvs[1] = 0.5;

          for (let ring = 1; ring <= radialSubdivisions; ring += 1) {
            const ringRadius = radius * (ring / radialSubdivisions);
            const ringStart = 1 + (ring - 1) * ringStride;
            for (
              let segment = 0;
              segment <= angularSegments;
              segment += 1
            ) {
              const angle = (segment / angularSegments) * Math.PI * 2;
              const vertexIndex = ringStart + segment;
              const x = Math.cos(angle) * ringRadius;
              const z = Math.sin(angle) * ringRadius;
              positions[vertexIndex * 3] = x;
              positions[vertexIndex * 3 + 1] = 0;
              positions[vertexIndex * 3 + 2] = z;
              uvs[vertexIndex * 2] = x / (radius * 2) + 0.5;
              uvs[vertexIndex * 2 + 1] = z / (radius * 2) + 0.5;
            }
          }

          const firstRingStart = 1;
          for (let segment = 0; segment < angularSegments; segment += 1) {
            indices.push(
              0,
              firstRingStart + segment,
              firstRingStart + segment + 1
            );
          }

          for (let ring = 2; ring <= radialSubdivisions; ring += 1) {
            const innerStart = 1 + (ring - 2) * ringStride;
            const outerStart = 1 + (ring - 1) * ringStride;
            for (let segment = 0; segment < angularSegments; segment += 1) {
              const innerA = innerStart + segment;
              const innerB = innerStart + segment + 1;
              const outerA = outerStart + segment;
              const outerB = outerStart + segment + 1;
              indices.push(innerA, outerA, outerB, innerA, outerB, innerB);
            }
          }

          geometry.setAttribute(
            'position',
            new THREE.BufferAttribute(positions, 3)
          );
          geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
          geometry.setIndex(indices);
          geometry.deleteAttribute('normal');
          geometry.computeVertexNormals();
          geometry.computeBoundingSphere();
          return geometry;
        }

        function distanceToIceCrack(pointX, pointZ, crack) {
          const segmentX = crack.endX - crack.startX;
          const segmentZ = crack.endZ - crack.startZ;
          const segmentLengthSquared =
            segmentX * segmentX + segmentZ * segmentZ;
          const projection = Math.max(
            0,
            Math.min(
              1,
              ((pointX - crack.startX) * segmentX +
                (pointZ - crack.startZ) * segmentZ) /
                Math.max(0.0001, segmentLengthSquared)
            )
          );
          const nearestX = crack.startX + segmentX * projection;
          const nearestZ = crack.startZ + segmentZ * projection;
          return Math.hypot(pointX - nearestX, pointZ - nearestZ);
        }

        const iceCracks = [];
        for (let originIndex = 0; originIndex < 4; originIndex += 1) {
          const originAngle = Math.random() * Math.PI * 2;
          const originRadius = Math.random() * LAKE_RADIUS * 0.55;
          const startX = Math.cos(originAngle) * originRadius;
          const startZ = Math.sin(originAngle) * originRadius;
          const branchCount = 3 + Math.floor(Math.random() * 3);
          const mainDirection = Math.random() * Math.PI * 2;

          for (let branchIndex = 0; branchIndex < branchCount; branchIndex += 1) {
            const branchAngle =
              mainDirection +
              (branchIndex / branchCount) * Math.PI * 2 +
              (Math.random() - 0.5) * 0.5;
            const branchLength = 1.8 + Math.random() * 4.8;
            let endX = startX + Math.cos(branchAngle) * branchLength;
            let endZ = startZ + Math.sin(branchAngle) * branchLength;
            const endRadius = Math.hypot(endX, endZ);
            const maximumEndRadius = LAKE_RADIUS * 0.93;
            if (endRadius > maximumEndRadius) {
              endX *= maximumEndRadius / endRadius;
              endZ *= maximumEndRadius / endRadius;
            }
            iceCracks.push({
              startX,
              startZ,
              endX,
              endZ,
              width: 0.055 + Math.random() * 0.055
            });
          }
        }

        const iceGeometry = createSubdividedCircleGeometry(
          LAKE_RADIUS,
          ICE_ANGULAR_SEGMENTS,
          ICE_RADIAL_SUBDIVISIONS
        );
        const icePositions = iceGeometry.attributes.position;
        const iceColors = new Float32Array(icePositions.count * 3);
        const iceBaseColor = new THREE.Color(0xc8e0f0);
        const iceCrackColor = new THREE.Color(0x7aaac0);
        const iceCrackTint = new THREE.Color(
          iceCrackColor.r / iceBaseColor.r,
          iceCrackColor.g / iceBaseColor.g,
          iceCrackColor.b / iceBaseColor.b
        );
        const iceNeutralTint = new THREE.Color(0xffffff);
        const iceVertexTint = new THREE.Color();

        for (let vertexIndex = 0; vertexIndex < icePositions.count; vertexIndex += 1) {
          const x = icePositions.getX(vertexIndex);
          const z = icePositions.getZ(vertexIndex);
          let crackStrength = 0;

          for (let crackIndex = 0; crackIndex < iceCracks.length; crackIndex += 1) {
            const crack = iceCracks[crackIndex];
            const distance = distanceToIceCrack(x, z, crack);
            if (distance < crack.width * 2.8) {
              const rawStrength = Math.max(
                0,
                Math.min(1, 1 - distance / (crack.width * 2.8))
              );
              const smoothStrength =
                rawStrength * rawStrength * (3 - 2 * rawStrength);
              crackStrength = Math.max(crackStrength, smoothStrength);
            }
          }

          const pressureRidge = crackStrength * (Math.random() * 0.016);
          icePositions.setY(
            vertexIndex,
            (Math.random() - 0.5) * 0.06 + pressureRidge

          iceVertexTint.lerpColors(
            iceNeutralTint,
            iceCrackTint,
            crackStrength

          iceColors[vertexIndex * 3] = iceVertexTint.r;
          iceColors[vertexIndex * 3 + 1] = iceVertexTint.g;
          iceColors[vertexIndex * 3 + 2] = iceVertexTint.b;

        iceGeometry.setAttribute(

        iceGeometry.computeVertexNormals();
        iceGeometry.computeBoundingSphere();

        const iceSurface = new THREE.Mesh(

        markSSRReflectiveObject(iceSurface, 0.05);

        const waterDepth = new THREE.Mesh(

          new THREE.MeshStandardMaterial({

        const iceEdgeGeometry = new THREE.TorusGeometry(

        const iceEdgePositions = iceEdgeGeometry.attributes.position;
        for (

          const centerAngle = Math.atan2(y, x);
          const centerX = Math.cos(centerAngle) * LAKE_RADIUS;
          const centerY = Math.sin(centerAngle) * LAKE_RADIUS;
          const offsetX = x - centerX;
          const offsetY = y - centerY;
          const offsetLength = Math.max(
            0.0001,
            Math.hypot(offsetX, offsetY, z)

          iceEdgePositions.setXYZ(

            x + (offsetX / offsetLength) * displacement,

        iceEdgeGeometry.computeVertexNormals();
        iceEdgeGeometry.computeBoundingSphere();

        const lakeSnowRing = new THREE.Mesh(

          new THREE.MeshStandardMaterial({

        // A dark disc reads as a cut fishing hole; the tiny stake marks its spot.

        const fishingHoleBasePositions = Float32Array.from(

        const fishingHole = new THREE.Mesh(

        function updateFishingHoleRipple(elapsed) {

            const vertexAngle = Math.atan2(baseY, baseX);
            const ripple = Math.sin(elapsed * 0.35 + vertexAngle) * 0.02;
            const rippleRadius = 0.3 + ripple;
            positions.setXY(

        // A quiet stargazing patch tucked behind the cabin.

        const bagWidth = 3.4;

        const sleepingBagMaterial = new THREE.MeshStandardMaterial({

        const sleepingBag = new THREE.Mesh(

        // Detailed tapered pines, scattered in loose clusters around clearings.
        const pineFoliageMaterial = new THREE.MeshStandardMaterial({
          color: 0x0d2010,
          emissive: 0x1a1008,
          emissiveIntensity: 0,
          roughness: 0.9,
          metalness: 0
        });
        const pineBarkMaterial = new THREE.MeshStandardMaterial({
          color: 0x2a1a0e,
          roughness: 0.95,
          metalness: 0,
          vertexColors: true
        });
        const pineSnowMaterial = new THREE.MeshStandardMaterial({
          color: 0xe8f4ff,
          emissive: 0xff6a1a,
          emissiveIntensity: 0,
          roughness: 0.95,
          metalness: 0,
          transparent: true,
          side: THREE.DoubleSide
        });
        const pineTrunkHeight = 5.4;
        const pineTrunkBottomRadius = 0.34;
        const pineTrunkGeometry = new THREE.CylinderGeometry(
          pineTrunkBottomRadius * 0.3,
          pineTrunkBottomRadius,
          pineTrunkHeight,
          16,
          10
        );
        const pineTrunkPositions = pineTrunkGeometry.attributes.position;
        const pineTrunkColors = new Float32Array(
          pineTrunkPositions.count * 3
        );

        for (
          let vertexIndex = 0;
          vertexIndex < pineTrunkPositions.count;
          vertexIndex += 1
        ) {
          const normalizedHeight =
            pineTrunkPositions.getY(vertexIndex) / pineTrunkHeight + 0.5;
          const bandVariation =
            Math.sin(normalizedHeight * Math.PI * 16) * 0.11;
          const fineVariation =
            Math.sin(
              pineTrunkPositions.getX(vertexIndex) * 31 +
                pineTrunkPositions.getZ(vertexIndex) * 23
            ) * 0.035;
          const brightness = Math.max(
            0.72,
            Math.min(1.12, 0.92 + bandVariation + fineVariation)
          );
          pineTrunkColors[vertexIndex * 3] = brightness;
          pineTrunkColors[vertexIndex * 3 + 1] = brightness;
          pineTrunkColors[vertexIndex * 3 + 2] = brightness;
        }
        pineTrunkGeometry.setAttribute(
          'color',
          new THREE.BufferAttribute(pineTrunkColors, 3)
        );
        pineTrunkGeometry.computeVertexNormals();
        const treeLightingEntries = [];

        const treeLandmarkClearances = [
          { x: cabin.position.x, z: cabin.position.z, radius: 18 },
          { x: campfire.position.x, z: campfire.position.z, radius: 11.2 },
          { x: lake.position.x, z: lake.position.z, radius: 19.5 },
          {
            x: stargazingSpot.position.x,
            z: stargazingSpot.position.z,
            radius: 14.8
          }
        ];
        const treePositions = [];
        const treeInstanceData = [];
        const forestClusterCenters = [];
        const TREE_COUNT = 60 + Math.floor(Math.random() * 21);
        const TREE_SPACING = 4;
        const TREE_COLLISION_RADIUS = 0.6;

        function randomForestPoint(maximumRadius) {
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.sqrt(Math.random()) * maximumRadius;
          return {
            x: Math.cos(angle) * radius,
            z: Math.sin(angle) * radius
          };
        }

        function treePositionIsClear(positionX, positionZ) {
          for (let i = 0; i < treeLandmarkClearances.length; i += 1) {
            const landmark = treeLandmarkClearances[i];
            if (
              Math.hypot(positionX - landmark.x, positionZ - landmark.z) <
              landmark.radius
            ) {
              return false;
            }
          }

          for (let i = 0; i < mountainFootprints.length; i += 1) {
            const mountain = mountainFootprints[i];
            if (
              Math.hypot(positionX - mountain.x, positionZ - mountain.z) <
              mountain.radius + 5
            ) {
              return false;
            }
          }

          for (let i = 0; i < treePositions.length; i += 1) {
            const treePosition = treePositions[i];
            if (
              Math.hypot(
                positionX - treePosition.x,
                positionZ - treePosition.z
              ) < TREE_SPACING
            ) {
              return false;
            }
          }
          return true;
        }

        for (let i = 0; i < 11; i += 1) {
          forestClusterCenters.push(randomForestPoint(49));
        }

        let treePlacementAttempts = 0;
        while (treePositions.length < TREE_COUNT && treePlacementAttempts < 50000) {
          treePlacementAttempts += 1;
          let candidate;

          if (Math.random() < 0.78) {
            const cluster =
              forestClusterCenters[
                Math.floor(Math.random() * forestClusterCenters.length)
              ];
            candidate = {
              x:
                cluster.x +
                (Math.random() + Math.random() + Math.random() - 1.5) * 9,
              z:
                cluster.z +
                (Math.random() + Math.random() + Math.random() - 1.5) * 9
            };
          } else {
            candidate = randomForestPoint(56);
          }

          if (
            Math.hypot(candidate.x, candidate.z) > 58 ||
            !treePositionIsClear(candidate.x, candidate.z)

          const treeScale = 0.7 + Math.random() * 1.1;

            tierCount: 5 + Math.floor(Math.random() * 3),
            snowLoad: 0.4 + Math.random() * 0.6,
            windOffset: Math.random() * Math.PI * 2,
            foliageColor: new THREE.Color(0x0d2010),
            snowColor: new THREE.Color(0xe8f4ff)
          });
          collidables.push({
            type: 'circle',
            x: candidate.x,
            z: candidate.z,
            radius: TREE_COLLISION_RADIUS

        }

        const detailedForest = new THREE.Group();
        detailedForest.name = 'INSTANCED_LOD_PINE_FOREST';

        const instancedFoliageMaterial = pineFoliageMaterial.clone();
        instancedFoliageMaterial.color.setHex(0xffffff);
        const instancedSnowMaterial = pineSnowMaterial.clone();
        instancedSnowMaterial.color.setHex(0xffffff);
        instancedSnowMaterial.opacity = 0.95;
        instancedSnowMaterial.depthWrite = true;
        const maximumTreeInstances = treeInstanceData.length;

        const MAX_TREE_TIERS = 7;
        const foliageTierGeometry = new THREE.ConeGeometry(1, 1, 16, 3);
        const snowTierGeometry = new THREE.ConeGeometry(1, 1, 16, 2);

        const fullFoliageBatches = [];

        for (let tierIndex = 0; tierIndex < MAX_TREE_TIERS; tierIndex += 1) {

          const snowBatch = new THREE.InstancedMesh(

          snowBatch.receiveShadow = true;
          snowBatch.frustumCulled = false;
          for (let i = 0; i < maximumTreeInstances; i += 1) {

          if (snowBatch.instanceColor) {
            snowBatch.instanceColor.needsUpdate = true;

        const treeTrunkInstances = new THREE.InstancedMesh(

        const treeBaseMatrix = new THREE.Matrix4();

        const treePosition = new THREE.Vector3();
        const treeScale = new THREE.Vector3();
        const treeLocalPosition = new THREE.Vector3();
        const treeLocalScale = new THREE.Vector3();
        const treeQuaternion = new THREE.Quaternion();
        const treeLocalQuaternion = new THREE.Quaternion();
        const treeEuler = new THREE.Euler();
        const treeLocalEuler = new THREE.Euler();
        const zeroMatrix = new THREE.Matrix4().makeScale(0, 0, 0);

        for (let i = 0; i < treeInstanceData.length; i += 1) {
          const treeData = treeInstanceData[i];
          treeData.tierVariations = [];
          for (let tierIndex = 0; tierIndex < MAX_TREE_TIERS; tierIndex += 1) {
            treeData.tierVariations.push({
              radius: 0.96 + Math.random() * 0.08,

              rotation: THREE.MathUtils.degToRad(

          treeQuaternion.setFromEuler(treeEuler);

          treeLocalPosition.set(0, pineTrunkHeight * 0.5, 0);
          treeLocalMatrix.compose(

          treeWorldMatrix.multiplyMatrices(treeBaseMatrix, treeLocalMatrix);

          const tierCount = treeData.tierCount;
          for (let tierIndex = 0; tierIndex < MAX_TREE_TIERS; tierIndex += 1) {
            if (tierIndex < tierCount) {
              const tierProgress = tierIndex / Math.max(1, tierCount - 1);
              const variation = treeData.tierVariations[tierIndex];
              const tierRadius =
                THREE.MathUtils.lerp(2.55, 0.68, tierProgress) *

              const tierHeight =
                THREE.MathUtils.lerp(3.55, 1.55, tierProgress) *

              const tierY =
                2.45 + tierIndex * (6.25 / Math.max(1, tierCount - 1));

              treeLocalPosition.set(0, tierY, 0);

              treeLocalQuaternion.setFromEuler(treeLocalEuler);
              treeLocalScale.set(tierRadius, tierHeight, tierRadius);
              treeLocalMatrix.compose(

                treeLocalQuaternion,

              treeWorldMatrix.multiplyMatrices(treeBaseMatrix, treeLocalMatrix);

              const snowLoadScale = 0.68 + treeData.snowLoad * 0.32;

              treeLocalEuler.set(

                variation.rotation + variation.snowRotation,

              );
              treeLocalQuaternion.setFromEuler(treeLocalEuler);
              treeLocalScale.set(
                tierRadius * 1.04 * variation.snowX * snowLoadScale,
                tierHeight * 0.28 * variation.snowY,
                tierRadius * 1.04 * variation.snowZ * snowLoadScale
              );
              treeLocalMatrix.compose(
                treeLocalPosition,
                treeLocalQuaternion,
                treeLocalScale
              );
              treeWorldMatrix.multiplyMatrices(treeBaseMatrix, treeLocalMatrix);
              fullSnowBatches[tierIndex].setMatrixAt(i, treeWorldMatrix);
            } else {
              fullFoliageBatches[tierIndex].setMatrixAt(i, zeroMatrix);
              fullSnowBatches[tierIndex].setMatrixAt(i, zeroMatrix);
            }
          }

          treeLightingEntries.push(treeData);
        }

        treeTrunkInstances.instanceMatrix.needsUpdate = true;
        for (let tierIndex = 0; tierIndex < MAX_TREE_TIERS; tierIndex += 1) {
          fullFoliageBatches[tierIndex].instanceMatrix.needsUpdate = true;
          fullSnowBatches[tierIndex].instanceMatrix.needsUpdate = true;
          if (fullFoliageBatches[tierIndex].instanceColor) {

        scene.add(detailedForest);

        const rockMaterial = new THREE.MeshStandardMaterial({
          color: 0x404040,

        const rockSnowMaterial = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          emissive: 0xffffff,
          emissiveIntensity: 0.2,

        const ROCK_COUNT = 4 + Math.floor(Math.random() * 3);
        const rockPositions = [];
        const rockBodyGeometries = [];

        let rockPlacementAttempts = 0;

        while (
          rockPositions.length < ROCK_COUNT &&

          rockPlacementAttempts += 1;
          const candidate = randomForestPoint(46);
          if (!treePositionIsClear(candidate.x, candidate.z)) continue;
          if (
            rockPositions.some(
              (rockPosition) =>
                Math.hypot(
                  candidate.x - rockPosition.x,
                  candidate.z - rockPosition.z
                ) < 6
            )
          ) {
            continue;
          }

          const rockGroup = new THREE.Group();
          const rock = new THREE.Mesh(
            new THREE.SphereGeometry(1, 8, 6),
            rockMaterial

          rock.position.y = 0.52;
          rock.scale.set(1.5, 0.6, 1.2);
          rock.castShadow = false;
          rock.receiveShadow = true;
          rockGroup.add(rock);

          const rockSnow = new THREE.Mesh(
            new THREE.CylinderGeometry(0.62, 0.76, 0.09, 10),
            rockSnowMaterial
          );
          rockSnow.position.y = 1.08;
          rockSnow.scale.set(1.2, 1, 0.95);
          rockSnow.castShadow = false;
          rockSnow.receiveShadow = true;
          rockGroup.add(rockSnow);

          rockGroup.position.set(
            candidate.x,
            getTerrainHeightAt(candidate.x, candidate.z),
            candidate.z
          );
          rockGroup.rotation.y = Math.random() * Math.PI * 2;
          rockGroup.updateMatrix();
          rock.updateMatrix();
          rockSnow.updateMatrix();
          const rockBodyMatrix = new THREE.Matrix4().multiplyMatrices(
            rockGroup.matrix,
            rock.matrix
          );
          const rockSnowMatrix = new THREE.Matrix4().multiplyMatrices(
            rockGroup.matrix,
            rockSnow.matrix
          );
          rockBodyGeometries.push(
            rock.geometry.clone().applyMatrix4(rockBodyMatrix)
          );
          rockTopSnowGeometries.push(
            rockSnow.geometry.clone().applyMatrix4(rockSnowMatrix)
          );
          rockPositions.push(candidate);
        }

        const mergedRockGroup = new THREE.Group();
        mergedRockGroup.name = 'MERGED_ROCKS';
        const mergedRockBodies = new THREE.Mesh(
          THREE.BufferGeometryUtils.mergeBufferGeometries(
            rockBodyGeometries,
            false
          ),
          rockMaterial
        );
        mergedRockBodies.geometry.computeBoundingSphere();
        mergedRockBodies.receiveShadow = true;
        mergedRockGroup.add(mergedRockBodies);
        const mergedRockSnow = new THREE.Mesh(
          THREE.BufferGeometryUtils.mergeBufferGeometries(
            rockTopSnowGeometries,
            false
          ),
          rockSnowMaterial
        );
        mergedRockSnow.geometry.computeBoundingSphere();
        mergedRockSnow.receiveShadow = true;
        mergedRockGroup.add(mergedRockSnow);
        registerDynamicOutdoorShadowCaster(
          mergedRockGroup,
          0,
          0
        );
        scene.add(mergedRockGroup);

        function createSoftAOTexture() {
          const canvas = document.createElement('canvas');
          canvas.width = 96;
          canvas.height = 96;
          const context = canvas.getContext('2d');
          const gradient = context.createRadialGradient(
            48,
            48,
            3,
            48,
            48,
            48
          );
          gradient.addColorStop(0, '#ffffff');
          gradient.addColorStop(0.48, '#d8d8d8');
          gradient.addColorStop(0.78, '#707070');
          gradient.addColorStop(1, '#000000');
          context.fillStyle = gradient;
          context.fillRect(0, 0, 96, 96);
          return new THREE.CanvasTexture(canvas);
        }

        const largeScaleAOMaterial = new THREE.MeshStandardMaterial({
          color: 0x000000,
          roughness: 1,
          metalness: 0,
          transparent: true,
          opacity: 0.25,
          alphaMap: createSoftAOTexture(),
          depthWrite: false,
          side: THREE.DoubleSide,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1
        });
        const largeScaleAOGeometry = new THREE.CircleGeometry(1, 48);
        largeScaleAOGeometry.rotateX(-Math.PI / 2);
        const largeScaleAOPlacements = [
          {
            x: cabin.position.x,
            z: cabin.position.z,
            radius: Math.hypot(CABIN_WIDTH * 0.5, CABIN_DEPTH * 0.5)
          }
        ];
        for (let i = 0; i < treeInstanceData.length; i += 1) {
          const treeData = treeInstanceData[i];
          largeScaleAOPlacements.push({
            x: treeData.x,
            z: treeData.z,
            radius: Math.max(0.9, treeData.scale * 2.15)
          });
        }
        for (let i = 0; i < rockPositions.length; i += 1) {
          largeScaleAOPlacements.push({
            x: rockPositions[i].x,
            z: rockPositions[i].z,
            radius: 1.55
          });
        }

        const largeScaleAOMesh = new THREE.InstancedMesh(
          largeScaleAOGeometry,
          largeScaleAOMaterial,
          largeScaleAOPlacements.length
        );
        const largeScaleAOMatrix = new THREE.Matrix4();
        const largeScaleAOPosition = new THREE.Vector3();
        const largeScaleAOQuaternion = new THREE.Quaternion();
        const largeScaleAOScale = new THREE.Vector3();
        for (let i = 0; i < largeScaleAOPlacements.length; i += 1) {
          const placement = largeScaleAOPlacements[i];
          largeScaleAOPosition.set(
            placement.x,
            getTerrainHeightAt(placement.x, placement.z) + 0.018,
            placement.z
          );
          largeScaleAOScale.set(placement.radius, 1, placement.radius);
          largeScaleAOMatrix.compose(
            largeScaleAOPosition,
            largeScaleAOQuaternion,
            largeScaleAOScale
          );
          largeScaleAOMesh.setMatrixAt(i, largeScaleAOMatrix);
        }
        largeScaleAOMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
        largeScaleAOMesh.instanceMatrix.needsUpdate = true;
        largeScaleAOMesh.castShadow = false;
        largeScaleAOMesh.receiveShadow = false;
        largeScaleAOMesh.frustumCulled = false;
        scene.add(largeScaleAOMesh);

        const snowDriftGeometry = new THREE.SphereGeometry(
          1,
          16,
          8,
          0,
          Math.PI * 2,
          0,
          Math.PI * 0.5
        );
        const snowDriftColors = new Float32Array(
          snowDriftGeometry.attributes.position.count * 3
        );
        snowDriftColors.fill(1);
        snowDriftGeometry.setAttribute(
          'color',
          new THREE.BufferAttribute(snowDriftColors, 3)
        );
        const snowDriftPlacements = [];

        function addWindwardSnowDrift(
          objectX,
          objectZ,
          offsetDistance,
          size,
          lateralOffset = 0
        ) {
          const lateralX = -windDirection.z;
          const lateralZ = windDirection.x;
          const x =
            objectX - windDirection.x * offsetDistance +
            lateralX * lateralOffset;
          const z =
            objectZ - windDirection.z * offsetDistance +
            lateralZ * lateralOffset;
          snowDriftPlacements.push({
            x,
            y: getTerrainHeightAt(x, z) + 0.012,
            z,
            size,
            rotation:
              Math.atan2(windDirection.x, windDirection.z) +
              Math.PI * 0.5 +
              (Math.random() - 0.5) * 0.35
          });
        }

        addWindwardSnowDrift(cabin.position.x, cabin.position.z, 5.45, 1.45, -3);
        addWindwardSnowDrift(cabin.position.x, cabin.position.z, 5.65, 1.7, 0);
        addWindwardSnowDrift(cabin.position.x, cabin.position.z, 5.35, 1.35, 3);

        for (let i = 0; i < treeInstanceData.length; i += 1) {
          const treeData = treeInstanceData[i];
          addWindwardSnowDrift(
            treeData.x,
            treeData.z,
            0.58 + treeData.scale * 0.18,
            0.38 + treeData.scale * 0.24
          );
        }
        for (let i = 0; i < rockPositions.length; i += 1) {
          addWindwardSnowDrift(
            rockPositions[i].x,
            rockPositions[i].z,
            1.15,
            0.72 + Math.random() * 0.24
          );
        }

        const snowDriftMatrix = new THREE.Matrix4();
        const snowDriftPosition = new THREE.Vector3();
        const snowDriftQuaternion = new THREE.Quaternion();
        const snowDriftScale = new THREE.Vector3();
        const snowDriftEuler = new THREE.Euler();
        const snowDriftGeometries = [];
        for (let i = 0; i < snowDriftPlacements.length; i += 1) {
          const drift = snowDriftPlacements[i];
          snowDriftPosition.set(drift.x, drift.y, drift.z);
          snowDriftEuler.set(0, drift.rotation, 0);
          snowDriftQuaternion.setFromEuler(snowDriftEuler);
          snowDriftScale.set(
            1.4 * drift.size,
            0.35 * drift.size,
            drift.size * (0.8 + Math.random() * 0.25)
          );
          snowDriftMatrix.compose(
            snowDriftPosition,
            snowDriftQuaternion,

          );
          snowDriftGeometries.push(
            snowDriftGeometry.clone().applyMatrix4(snowDriftMatrix)
          );
        }
        const mergedSnowDriftGeometry =
          THREE.BufferGeometryUtils.mergeBufferGeometries(

        mergedSnowDriftGeometry.computeBoundingSphere();
        const snowDriftMesh = new THREE.Mesh(

        );
        snowDriftMesh.name = 'MERGED_SNOW_DRIFTS';
        snowDriftMesh.castShadow = false;
        snowDriftMesh.receiveShadow = true;
        snowDriftMesh.frustumCulled = true;
        scene.add(snowDriftMesh);

        // Three translucent shader curtains create a slow aurora above the scene.
        const auroraVertexShader = `
          uniform float time;
          uniform float phase;
          varying vec2 vUv;
          varying float vWave;

          void main() {
            vUv = uv;
            vec3 displaced = position;
            float wave = sin(position.x * 0.075 + time * 0.32 + phase);
            wave += sin(position.x * 0.16 - time * 0.21 + phase * 1.7) * 0.42;
            float curtain = sin(uv.y * 3.14159265);
            displaced.z += wave * curtain * 3.4;
            displaced.y += sin(position.x * 0.045 + time * 0.18 + phase) * 1.15;
            vWave = wave;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
          }
        `;

        const auroraFragmentShader = `
          uniform vec3 color;
          uniform float opacity;
          uniform float time;
          uniform float phase;
          varying vec2 vUv;
          varying float vWave;

          void main() {
            float horizontalFade = smoothstep(0.0, 0.1, vUv.x) *
              (1.0 - smoothstep(0.9, 1.0, vUv.x));
            float verticalFade = smoothstep(0.0, 0.16, vUv.y) *
              (1.0 - smoothstep(0.72, 1.0, vUv.y));
            float bands = 0.55 + 0.45 * sin(
              vUv.x * 20.0 + vUv.y * 8.0 + time * 0.22 + phase + vWave
            );
            float alpha = opacity * horizontalFade * verticalFade * (0.48 + bands * 0.52);
            gl_FragColor = vec4(color, alpha);
          }
        `;

        const auroraGeometry = new THREE.PlaneGeometry(150, 28, 72, 10);
        const auroraMaterials = [];

        function addAurora(color, opacity, position, rotationY, phase) {
          const material = new THREE.ShaderMaterial({
            uniforms: {
              time: { value: 0 },
              phase: { value: phase },
              color: { value: new THREE.Color(color) },
              opacity: { value: opacity }
            },
            vertexShader: auroraVertexShader,
            fragmentShader: auroraFragmentShader,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            fog: false
          });
          material.userData.baseOpacity = opacity;
          const aurora = new THREE.Mesh(auroraGeometry, material);
          aurora.position.copy(position);
          aurora.rotation.set(-0.06, rotationY, 0);
          aurora.renderOrder = -1;
          auroraMaterials.push(material);
          scene.add(aurora);
        }

        addAurora(0x00ffaa, 0.21, new THREE.Vector3(0, 49, -78), 0, 0);
        addAurora(0xaa00ff, 0.16, new THREE.Vector3(-58, 54, 20), 1.95, 2.1);
        addAurora(0x8dffc7, 0.19, new THREE.Vector3(56, 47, 25), -1.95, 4.4);

        // A tiny dynamic cube environment gives the low-roughness ice a
        // responsive aurora tint and a narrow, flickering fire horizon streak.
        const ICE_ENVIRONMENT_FACE_SIZE = 24;
        const iceEnvironmentCanvases = [];
        const iceEnvironmentContexts = [];
        for (let i = 0; i < 6; i += 1) {

        function createAmbientNoiseBuffer(useBrownNoise) {
          const duration = 4;
          const frameCount = Math.floor(audioContext.sampleRate * duration);
          const buffer = audioContext.createBuffer(
            1,
            frameCount,
            audioContext.sampleRate
          );
          const samples = buffer.getChannelData(0);
          let brownSample = 0;

          for (let i = 0; i < frameCount; i += 1) {
            const whiteSample = Math.random() * 2 - 1;
            if (useBrownNoise) {
              brownSample = (brownSample + whiteSample * 0.025) / 1.025;
              samples[i] = brownSample * 2.4;
            } else {
              samples[i] = whiteSample;
            }
          }
          return buffer;
        }

        function setAmbientAudioMix(inside, immediate = false) {
          if (!ambientSoundNodes || !audioContext) return;
          if (ambientAudioInsideState === inside && !immediate) return;

          const now = audioContext.currentTime;
          const transitionDuration = immediate ? 0.02 : 0.8;
          const windTarget = OUTDOOR_WIND_GAIN * (inside ? 0.2 : 1);
          const humTarget = inside ? INDOOR_HUM_GAIN : 0;
          const { windGain, humGain } = ambientSoundNodes;

          windGain.gain.cancelScheduledValues(now);
          windGain.gain.setValueAtTime(windGain.gain.value, now);
          windGain.gain.linearRampToValueAtTime(
            windTarget,
            now + transitionDuration
          );
          humGain.gain.cancelScheduledValues(now);
          humGain.gain.setValueAtTime(humGain.gain.value, now);
          humGain.gain.linearRampToValueAtTime(
            humTarget,
            now + transitionDuration
          );
          ambientAudioInsideState = inside;
        }

        function initializeAmbientAudio() {
          if (!audioContext || ambientSoundNodes) return;

          const windSource = audioContext.createBufferSource();
          const windFilter = audioContext.createBiquadFilter();
          const windGain = audioContext.createGain();
          windSource.buffer = createAmbientNoiseBuffer(false);
          windSource.loop = true;
          windFilter.type = 'bandpass';
          windFilter.frequency.value = 520;
          windFilter.Q.value = 0.48;
          windGain.gain.value = 0;
          windSource.connect(windFilter);
          windFilter.connect(windGain);
          windGain.connect(audioContext.destination);

          const humSource = audioContext.createBufferSource();
          const humFilter = audioContext.createBiquadFilter();
          const humGain = audioContext.createGain();
          humSource.buffer = createAmbientNoiseBuffer(true);
          humSource.loop = true;
          humFilter.type = 'lowpass';
          humFilter.frequency.value = 145;
          humFilter.Q.value = 0.8;
          humGain.gain.value = 0;
          humSource.connect(humFilter);
          humFilter.connect(humGain);
          humGain.connect(audioContext.destination);

          windSource.start();
          humSource.start();
          ambientSoundNodes = { windSource, windGain, humSource, humGain };
          setAmbientAudioMix(isInsideCabin, true);
        }

        function ensureAudioContext() {

        function playFootstep() {
          if (!audioContext || audioContext.state !== 'running') return;
          const duration = 0.03;
          const frameCount = Math.floor(audioContext.sampleRate * duration);
          const noiseBuffer = audioContext.createBuffer(
            1,
            frameCount,
            audioContext.sampleRate
          );
          const samples = noiseBuffer.getChannelData(0);
          for (let i = 0; i < frameCount; i += 1) {
            const envelope = 1 - i / frameCount;
            samples[i] = (Math.random() * 2 - 1) * envelope;
          }

          const source = audioContext.createBufferSource();
          const lowPass = audioContext.createBiquadFilter();
          const gain = audioContext.createGain();
          const now = audioContext.currentTime;
          source.buffer = noiseBuffer;
          lowPass.type = 'lowpass';
          lowPass.frequency.setValueAtTime(380, now);
          lowPass.Q.setValueAtTime(0.7, now);
          gain.gain.setValueAtTime(0.028, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          source.connect(lowPass);
          lowPass.connect(gain);
          gain.connect(audioContext.destination);
          source.start(now);
          source.stop(now + duration);
        }

        function startBreathPuff(isColder) {
          breathIsActive = true;

          breathPuff.position.x = (Math.random() - 0.5) * 0.035;

        function updateBreathEffect(elapsed, delta, isMoving) {
          if (breathIsActive) {
            breathAge += delta;
            const progress = Math.min(1, breathAge / 1.05);
            const fadeIn = Math.min(1, progress * 6);
            breathPuff.material.opacity =
              fadeIn * Math.pow(1 - progress, 1.25) * 0.13;
            breathPuff.scale.setScalar(
              (0.45 + progress * 2.35) * breathSizeMultiplier
            );
            breathPuff.position.y = -0.3 + progress * 0.035;

            if (progress >= 1) {
              breathIsActive = false;
              breathPuff.visible = false;
              breathPuff.material.opacity = 0;
            }
          }

          const canShowBreath = controls.isLocked && !isMoving;
          const breathInterval = playerStatus.warmth < 40 ? 2 : 4;

          if (!canShowBreath) {
            breathEligibleLastFrame = false;
            nextBreathTime = elapsed + breathInterval;
            return;
          }

          if (!breathEligibleLastFrame) {
            breathEligibleLastFrame = true;
            nextBreathTime = elapsed + breathInterval;
          } else if (nextBreathTime - elapsed > breathInterval) {
            nextBreathTime = elapsed + breathInterval;
          }

          if (elapsed >= nextBreathTime) {
            startBreathPuff(playerStatus.warmth < 40);
            nextBreathTime = elapsed + breathInterval;
          }

        function collectNearbyCollidables(playerX, playerZ) {
          nearbyCollidables.length = 0;
          for (let i = 0; i < collidables.length; i += 1) {
            const collider = collidables[i];
            if (collider.type === 'box') {
              const nearestX = Math.max(
                collider.minX,
                Math.min(playerX, collider.maxX)
              );
              const nearestZ = Math.max(
                collider.minZ,
                Math.min(playerZ, collider.maxZ)
              );
              const deltaX = playerX - nearestX;
              const deltaZ = playerZ - nearestZ;
              if (
                deltaX * deltaX + deltaZ * deltaZ <=
                COLLISION_PROXIMITY * COLLISION_PROXIMITY
              ) {
                nearbyCollidables.push(collider);
              }
            } else {
              const deltaX = playerX - collider.x;
              const deltaZ = playerZ - collider.z;
              const broadPhaseRadius = COLLISION_PROXIMITY + collider.radius;
              if (
                deltaX * deltaX + deltaZ * deltaZ <=
                broadPhaseRadius * broadPhaseRadius
              ) {
                nearbyCollidables.push(collider);
              }
            }
          }
        }

        function collidesWithNearbyObject(positionX, positionZ) {
          for (let i = 0; i < nearbyCollidables.length; i += 1) {
            const collider = nearbyCollidables[i];
            if (collider.type === 'box') {
              if (
                positionX + PLAYER_COLLISION_RADIUS > collider.minX &&
                positionX - PLAYER_COLLISION_RADIUS < collider.maxX &&
                positionZ + PLAYER_COLLISION_RADIUS > collider.minZ &&
                positionZ - PLAYER_COLLISION_RADIUS < collider.maxZ
              ) {
                return true;
              }
            } else {
              const deltaX = positionX - collider.x;
              const deltaZ = positionZ - collider.z;
              if (
                deltaX * deltaX + deltaZ * deltaZ <
                collider.radius * collider.radius
              ) {
                return true;
              }
            }
          }
          return false;
        }

        function resolvePlayerMovement(startX, startZ, intendedX, intendedZ) {
          let resolvedX = startX;
          let resolvedZ = startZ;

          // Resolve each axis independently so blocked forward motion can slide.
          if (!collidesWithNearbyObject(intendedX, startZ)) {
            resolvedX = intendedX;
          }
          if (!collidesWithNearbyObject(resolvedX, intendedZ)) {
            resolvedZ = intendedZ;
          }

          const distanceFromCenter = Math.hypot(resolvedX, resolvedZ);
          if (distanceFromCenter > WORLD_BOUNDARY_RADIUS) {
            const boundaryScale = WORLD_BOUNDARY_RADIUS / distanceFromCenter;
            const clampedX = resolvedX * boundaryScale;
            const clampedZ = resolvedZ * boundaryScale;

            if (!collidesWithNearbyObject(clampedX, clampedZ)) {
              resolvedX = clampedX;
              resolvedZ = clampedZ;
            } else {
              resolvedX = startX;
              resolvedZ = startZ;
            }
          }

          camera.position.x = resolvedX;
          camera.position.z = resolvedZ;
          return Math.hypot(resolvedX - startX, resolvedZ - startZ) > 0.0001;
        }

        function updatePlayerMovement(elapsed, delta) {
          const wasMoving = playerIsMoving;

          const forwardAmount =
            Number(movementKeys.forward) - Number(movementKeys.backward);
          const rightAmount =
            Number(movementKeys.right) - Number(movementKeys.left);
          const directionLength = Math.hypot(forwardAmount, rightAmount);
          playerIsMoving = controls.isLocked && directionLength > 0;

          const bobSmoothing = 1 - Math.exp(-delta * 8);
          headBobBlend +=
            (Number(playerIsMoving) - headBobBlend) * bobSmoothing;

          if (playerIsMoving) {
            const startX = camera.position.x;
            const startZ = camera.position.z;
            collectNearbyCollidables(startX, startZ);
            controls.moveForward(
              (forwardAmount / directionLength) * movementSpeed
            );
            controls.moveRight((rightAmount / directionLength) * movementSpeed);
            const intendedX = camera.position.x;
            const intendedZ = camera.position.z;
            playerIsMoving = resolvePlayerMovement(
              startX,
              startZ,
              intendedX,
              intendedZ
            );
          }

          camera.position.y =
            playerHeight + Math.sin(elapsed * 8) * 0.04 * headBobBlend;

          if (playerIsMoving && !wasMoving) {
            lastFootstepTime = elapsed - 0.5;
          }
          if (playerIsMoving && elapsed - lastFootstepTime >= 0.5) {
            playFootstep();
            lastFootstepTime = elapsed;
          }

        }

        function onPointerUnlock() {
          resetMovementKeys();
          playerIsMoving = false;
          updatePointerUi();
        }

        function updateColdEffects(warmth) {
          const isCold = warmth < 30;
          const isVeryCold = warmth === 0;
          coldVignette.classList.toggle('is-cold', isCold);
          coldVignette.setAttribute('aria-hidden', isCold ? 'false' : 'true');
          coldReminder.classList.toggle('is-visible', isVeryCold);
          coldReminder.setAttribute('aria-hidden', isVeryCold ? 'false' : 'true');
        }

        function setStatus(statusName, nextValue) {
          const clampedValue = Math.max(0, Math.min(100, Math.round(nextValue)));
          playerStatus[statusName] = clampedValue;
          statusElements[statusName].value.textContent = `${clampedValue}%`;
          statusElements[statusName].fill.style.setProperty('--value', `${clampedValue}%`);
          statusElements[statusName].track.setAttribute('aria-valuenow', clampedValue);
          if (statusName === 'warmth') updateColdEffects(clampedValue);
        }

        function closeEatPanel() {
          eatPopup.classList.remove('is-open');
          eatPopup.setAttribute('aria-hidden', 'true');
          updatePointerUi();
        }

        function closeCookPanel() {
          window.clearTimeout(cookingTimer);
          window.clearTimeout(cookingCloseTimer);
          cooking = false;
          cookClose.disabled = false;
          cookStatus.textContent = '';
          cookPopup.classList.remove('is-open');
          cookPopup.setAttribute('aria-hidden', 'true');
